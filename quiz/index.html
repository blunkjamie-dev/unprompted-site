<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Bot Are You?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one phone-width column. Crew stage on top, one question at a time below; the stage turns into your bot at the end.
   Single committed look: the crew's after-hours break room (deep teal-navy wall, warm floor), same in both host themes. */
:root{
  --wall:#14232e; --wall2:#1b3140; --floor:#2a3a46; --ink:#0f1318;
  --card:#f6f2e8; --cardInk:#14232e; --dim:#9fb4c2; --soft:#c9d6df;
  --pop:#f3ce5c; --teal:#60d5d8;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{background:var(--wall)}
body{background:var(--wall);color:var(--soft);font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;gap:2px}
.eyebrow{margin:0;font:900 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
h1{margin:0;font:400 clamp(38px,11vw,62px)/.95 var(--display);color:var(--pop);letter-spacing:.01em;text-wrap:balance;text-shadow:0 4px 0 var(--ink)}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--wall2);box-shadow:inset 0 0 0 3px var(--ink)}
.stage canvas{display:block;width:100%;max-width:100%;aspect-ratio:800/300}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--floor)}
.dots i.on{background:var(--pop)}
.dots i.now{background:var(--teal)}
.q{display:flex;flex-direction:column;gap:12px;animation:rise .3s ease-out both}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.ask{display:flex;align-items:center;gap:12px}
.ask .em{flex:none;font-size:40px;line-height:1}
.ask h2{margin:0;font:400 clamp(26px,7vw,36px)/1.05 var(--display);color:#fff;text-wrap:balance;min-width:0}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.a{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;text-align:left;cursor:pointer;background:var(--card);color:var(--cardInk);border:3px solid var(--ink);border-radius:18px;padding:12px 14px 14px;font:900 17px/1.15 var(--ui);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.a .em{font-size:32px;line-height:1}
.a:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.a:active,.a.picked{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.a.picked{background:var(--pop)}
.a:disabled{cursor:default}
.a:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.start{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.start p{margin:0;font:800 17px/1.35 var(--ui);color:var(--soft)}
.btn{cursor:pointer;font:400 22px/1 var(--display);letter-spacing:.02em;color:var(--cardInk);background:var(--pop);border:3px solid var(--ink);border-radius:999px;padding:14px 22px;box-shadow:0 5px 0 var(--ink);text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card)}
.btn.disc{background:#8c9cff}
.res{display:flex;flex-direction:column;gap:14px;animation:rise .35s ease-out both}
.you{margin:0;font:900 13px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.name{margin:0;font:400 clamp(54px,17vw,92px)/.85 var(--display);color:var(--c);text-shadow:0 5px 0 var(--ink)}
.nick{margin:0;font:400 26px/1 var(--display);color:#fff}
.tag{margin:0;font:800 19px/1.3 var(--ui);color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font:900 14px var(--ui);color:var(--cardInk);background:var(--c);border:2px solid var(--ink);border-radius:999px;padding:6px 12px}
.mix{display:flex;flex-direction:column;gap:6px}
.mix h3,.crew h3{margin:0;font:900 12px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:8px;align-items:center;font:900 13px var(--ui);color:#fff}
.bar .tr{height:14px;border-radius:99px;background:var(--floor);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar b{font-variant-numeric:tabular-nums;text-align:right;font-weight:900}
.buddy{display:flex;align-items:center;gap:12px;background:var(--floor);border-radius:16px;padding:8px 12px}
.buddy canvas{flex:none;width:64px;height:64px}
.buddy p{margin:0;font:800 15px/1.3 var(--ui);min-width:0}
.buddy b{color:var(--c);font:400 20px var(--display)}
.share{display:flex;flex-direction:column;gap:8px;background:var(--card);color:var(--cardInk);border:3px solid var(--ink);border-radius:18px;padding:12px 14px}
.share label{font:900 11px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:#4d6170}
.share textarea{width:100%;min-height:64px;resize:none;border:0;background:transparent;color:var(--cardInk);font:800 16px/1.35 var(--ui);padding:0}
.share .btn{font-size:19px;padding:11px 18px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{flex:1 1 160px}
.crew{display:flex;flex-direction:column;gap:8px}
.minis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mini{cursor:pointer;background:var(--floor);border:2px solid transparent;border-radius:12px;padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--soft);font:900 9px var(--ui);letter-spacing:.06em;min-width:0}
.mini canvas{width:100%;max-width:56px;aspect-ratio:1}
.mini.on{border-color:var(--pop)}
.draft{margin:0;text-align:center;font:800 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
@media (max-width:420px){.ans{gap:8px}.a{font-size:16px;padding:10px 12px 12px}.a .em{font-size:28px}.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.q,.res{animation:none}.a,.btn{transition:none}}
</style>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Unprompted Behavior · Crew quiz</p>
    <h1>Which bot are you?</h1>

<script src="/ub-stickers.js"></script><script>
// motion.js - the twelve motions from the motion pack spec (motion-pack-20261021/SPEC.md),
// written for the browser. Every function takes frame numbers (30 fps) and returns plain numbers.
// No drawing in here.
const M = (() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeIn = t => Math.pow(clamp(t), 3);
  const easeInOut = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const prog = (f, start, len) => clamp((f - start) / Math.max(1, len));

  // seeded random so every render of the same brief is identical
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // 1 pop-in: 0 -> 1.12 over 5 f, 1.12 -> 1 over 3 f, opacity over the first 3 f
  function popIn(f, start) {
    const d = f - start;
    if (d < 0) return { scale: 0, alpha: 0 };
    const scale = d < 5 ? lerp(0, 1.12, easeOut(d / 5)) : lerp(1.12, 1, easeOut((d - 5) / 3));
    return { scale, alpha: clamp(d / 3) };
  }

  // 2 slide: 4 f anticipation (3% the wrong way), n f travel, 2 f overshoot (3%), 2 f settle
  function slide(f, start, from, to, n = 12) {
    const d = f - start, dist = to - from;
    if (d <= 0) return from;
    if (d < 4) return from - dist * 0.03 * easeOut(d / 4);
    if (d < 4 + n) return lerp(from - dist * 0.03, to + dist * 0.03, easeOut((d - 4) / n));
    if (d < 4 + n + 2) return to + dist * 0.03;
    return lerp(to + dist * 0.03, to, easeOut((d - 4 - n - 2) / 2));
  }

  // 3 drop-bounce: 6 f fall (ease-in), contact on frame 7, bounce up 15% and back
  function dropBounce(f, start, fromY, toY) {
    const d = f - start, h = toY - fromY;
    if (d <= 0) return { y: fromY, contact: false };
    if (d < 6) return { y: lerp(fromY, toY, easeIn(d / 6)), contact: false };
    if (d < 7) return { y: toY, contact: true };
    if (d < 10) return { y: toY - h * 0.15 * easeOut((d - 7) / 3), contact: false };
    if (d < 13) return { y: toY - h * 0.15 * (1 - easeIn((d - 10) / 3)), contact: false };
    return { y: toY, contact: false };
  }

  // 4 punch-zoom: 1.00 -> amt over len f (ease-out), then hold
  const punchZoom = (f, start, amt = 1.08, len = 6) => f < start ? 1 : lerp(1, amt, easeOut((f - start) / len));

  // 5 hit: impact frame, then shake 8, 8, 4, 4, 2, 2 px alternating, then still
  function hit(f, start) {
    const d = f - start;
    if (d < 0 || d > 6) return { flash: 0, dx: 0, dy: 0 };
    const amp = [0, 8, 8, 4, 4, 2, 2][d], sign = d % 2 ? 1 : -1;
    return { flash: d === 0 ? 1 : 0, dx: amp * sign, dy: amp * 0.5 * -sign };
  }

  // 6 squash-stretch around a contact frame. Never on text.
  function squash(f, contact) {
    const d = f - contact;
    if (d < -2 || d > 3) return { sx: 1, sy: 1 };
    if (d < 0) return { sx: 0.92, sy: 1.10 };
    if (d === 0) return { sx: 1.12, sy: 0.88 };
    const t = easeOut(d / 3);
    return { sx: lerp(1.12, 1, t), sy: lerp(0.88, 1, t) };
  }

  // 7 blink: 2 f closing, 1 closed, 1 opening; gap 90-150 f, different per character
  function blink(f, seed) {
    const r = rng(seed); let at = Math.floor(30 + r() * 60);
    while (at + 4 < f) at += 90 + Math.floor(r() * 60);
    const d = f - at;
    if (d < 0 || d > 3) return 1;
    return [0.5, 0.1, 0.1, 0.6][d];
  }

  // 8 idle: 1 px breathing on a 60 f wave, +-0.5 degree on a 90 f wave
  const idle = (f, seed = 0) => ({
    dy: Math.sin((f + seed * 17) / 60 * Math.PI * 2),
    rot: Math.sin((f + seed * 29) / 90 * Math.PI * 2) * 0.5 * Math.PI / 180,
  });

  // 10 word-pop: each word 0.8 -> 1.05 -> 1.00 over 4 f, next word 3 f later
  function wordPop(f, start, i, gap = 3) {
    const d = f - (start + i * gap);
    if (d < 0) return { scale: 0.8, alpha: 0 };
    const scale = d < 2 ? lerp(0.8, 1.05, easeOut(d / 2)) : lerp(1.05, 1, easeOut((d - 2) / 2));
    return { scale, alpha: clamp(d / 2) };
  }

  // 11 whip: out over 4 f ease-in or in over 4 f ease-out, with a horizontal blur amount
  const whipOut = (f, start, width) => { const t = prog(f, start, 4); return { dx: -width * easeIn(t), blur: t > 0 && t < 1 ? 12 : 0 }; };
  const whipIn = (f, start, width) => { const t = prog(f, start, 4); return { dx: width * (1 - easeOut(t)), blur: t > 0 && t < 1 ? 12 : 0 }; };

  return { clamp, lerp, easeOut, easeIn, easeInOut, prog, rng, popIn, slide, dropBounce, punchZoom, hit, squash, blink, idle, wordPop, whipOut, whipIn };
})();
// kit.js - drawing helpers shared by every template. Also records where text lands on each
// frame so the self-check can tell if words sit under the Shorts buttons or are too small.
const K = (() => {
  const boxes = [];
  const FONT = "'Inter Display','Inter','Segoe UI Black','Arial Black',sans-serif";

  // Shorts app covers the top strip, the bottom caption/title area and the right-hand buttons.
  // On a Short the like/comment buttons only sit on the right below the middle.
  function safeZone(w, h) {
    if (h > w) return { x0: 50, y0: Math.round(h * 0.09), x1: w - 50, y1: Math.round(h * 0.78), btnX: w - 160, btnY: Math.round(h * 0.52) };
    return { x0: Math.round(w * 0.05), y0: Math.round(h * 0.05), x1: Math.round(w * 0.95), y1: Math.round(h * 0.95) };
  }

  function font(size, weight = 900, family = FONT) { return `${weight} ${Math.round(size)}px ${family}`; }

  // Fit text to a width by shrinking the size, never below min.
  function fit(ctx, str, maxW, size, weight = 900, min = 40, family = FONT, track = 0) {
    let s = size;
    for (; s > min; s -= 2) {
      ctx.font = font(s, weight, family);
      if (ctx.measureText(str).width + track * s * str.length <= maxW) break;
    }
    return s;
  }

  // Draw text and record its box (in canvas pixels, after the current transform).
  function text(ctx, str, x, y, o = {}) {
    const size = o.size || 80, weight = o.weight || 900;
    ctx.save();
    ctx.font = font(size, weight, o.family);
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.track) ctx.letterSpacing = `${o.track * size}px`;
    const w = ctx.measureText(str).width;
    if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur ?? size * 0.08; ctx.shadowOffsetY = o.shadowY ?? size * 0.06; }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeWidth || size * 0.14; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); ctx.shadowColor = 'transparent'; }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
    if (!o.noRecord && (o.alpha ?? 1) > 0.5) {
      const left = ctx.textAlign === 'center' ? x - w / 2 : ctx.textAlign === 'right' ? x - w : x;
      const m = ctx.getTransform();
      const pts = [[left, y - size / 2], [left + w, y - size / 2], [left, y + size / 2], [left + w, y + size / 2]]
        .map(([px, py]) => [m.a * px + m.c * py + m.e, m.b * px + m.d * py + m.f]);
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      boxes.push({ str, x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys), px: size * Math.hypot(m.c, m.d) });
    }
    ctx.restore();
    return w;
  }

  // Cached noise texture (grain, rust, yarn fuzz). Same seed, same picture.
  const cache = {};
  function grain(w, h, seed, base, spots, amount = 0.5) {
    const key = [w, h, seed, base, spots.join(), amount].join('|');
    if (cache[key]) return cache[key];
    const c = new OffscreenCanvas(w, h), g = c.getContext('2d'), r = M.rng(seed);
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    // big soft stains (blurred so they never look like polka dots)
    g.filter = 'blur(24px)';
    for (let i = 0; i < (w * h) / 40000 * amount + 3; i++) {
      g.globalAlpha = 0.10 + r() * 0.16; g.fillStyle = spots[Math.floor(r() * spots.length)];
      const rr = 40 + r() * 180; g.beginPath(); g.ellipse(r() * w, r() * h, rr, rr * (0.3 + r() * 0.6), r() * 3, 0, 7); g.fill();
    }
    g.filter = 'none';
    // fine pitting
    for (let i = 0; i < (w * h) / 300 * amount; i++) {
      g.globalAlpha = 0.08 + r() * 0.2; g.fillStyle = spots[Math.floor(r() * spots.length)];
      const rr = 0.8 + r() * r() * 5; g.beginPath(); g.arc(r() * w, r() * h, rr, 0, 7); g.fill();
    }
    g.filter = 'none'; g.globalAlpha = 1;
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    return (cache[key] = c);
  }

  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  function rivet(ctx, x, y, r, s) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, s.highlight); g.addColorStop(0.6, s.metal); g.addColorStop(1, s.dark);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }

  // Sparks burst from (x, y) starting at frame start. Deterministic.
  function sparks(ctx, f, start, x, y, seed, color, n = 26, spread = Math.PI * 2, dir = -Math.PI / 2) {
    const d = f - start; if (d < 0 || d > 22) return;
    const r = M.rng(seed);
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = dir + (r() - 0.5) * spread, sp = 18 + r() * 34, life = 10 + r() * 12;
      if (d > life) continue;
      const t = d / life, px = x + Math.cos(a) * sp * d, py = y + Math.sin(a) * sp * d + 1.2 * d * d;
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = color; ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(a) * sp * 0.8, py - Math.sin(a) * sp * 0.8 - 2.4 * d); ctx.stroke();
    }
    ctx.restore();
  }

  // Stand-in for real gameplay under overlays in previews only (never a real clip, no players).
  function footagePlaceholder(ctx, w, h, f) {
    const g = ctx.createLinearGradient(0, 0, w * 0.3, h);
    g.addColorStop(0, '#5d6b73'); g.addColorStop(0.55, '#7a8466'); g.addColorStop(1, '#3d3a2f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
    for (let i = 0; i < 6; i++) { const x = ((i * 397 + f * 3) % (w + 400)) - 200; ctx.fillRect(x, h * 0.55, 140 + i * 30, h * 0.45); }
    ctx.restore();
  }

  return { boxes, FONT, safeZone, font, fit, text, grain, roundRect, rivet, sparks, footagePlaceholder };
})();
// crew21.js - the v21 crew (as on the website "Meet the crew"), drawn in code so it stays sharp at 1080p.
// Feet at (o.x, o.y), o.s scale (1 = ~340 px tall). Round mitts only, never hands.
// Each bot has its own topper: Wrench tool belt, Rowan glasses + bow tie, Skippy headset, Bernard camera,
// Lyra star + cable, Kestrel goggles + feathers, Radar dish.
const C21 = (() => {
  const OUT = '#0f1318';
  const BOTS = {
    wrench:  { name: 'WRENCH',  body: '#f39732', dark: '#b8661a', leg: '#6f441e', eye: '#4fd1d4', ball: '#4fd1d4' },
    rowan:   { name: 'ROWAN',   body: '#60d5d8', dark: '#2f9598', leg: '#316567', eye: '#eef3f7', ball: '#f28c1c' },
    skippy:  { name: 'SKIPPY',  body: '#f3ce5c', dark: '#c19a2a', leg: '#7b621f', eye: '#60d5d8', ball: '#e0352b' },
    bernard: { name: 'BERNARD', body: '#a588ec', dark: '#7258c0', leg: '#4c3d7a', eye: '#f4f4f4', ball: '#e0352b' },
    lyra:    { name: 'LYRA',    body: '#88d779', dark: '#56a548', leg: '#3f7037', eye: '#f4f4f4', ball: '#f2cf4a' },
    kestrel: { name: 'KESTREL', body: '#6b88bc', dark: '#435f93', leg: '#354461', eye: '#f2c94c', ball: '#f2cf4a' },
    radar:   { name: 'RADAR',   body: '#d4dae1', dark: '#9aa3ad', leg: '#585e66', eye: '#7fd16b', ball: '#cbd1d7' },
  };
  const ORDER = ['wrench', 'rowan', 'skippy', 'bernard', 'lyra', 'kestrel', 'radar'];
  const P = (ctx, fill, lw) => { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); };

  function eyes(ctx, f, o, c, s) {
    const face = o.face || 'normal', b = face === 'normal' ? M.blink(f, o.seed || 1) : 1;
    ctx.save(); ctx.fillStyle = c.eye; ctx.strokeStyle = c.eye; ctx.lineCap = 'round';
    ctx.shadowColor = c.eye; ctx.shadowBlur = 18 * s;
    for (const side of [-1, 1]) {
      const x = side * 34 * s, y = -186 * s;
      ctx.lineWidth = 9 * s;
      if (face === 'happy') { ctx.beginPath(); ctx.arc(x, y + 10 * s, 16 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      else if (face === 'tired') { ctx.beginPath(); ctx.moveTo(x - 15 * s, y + 2 * s); ctx.lineTo(x + 15 * s, y + 2 * s); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y + 2 * s, 12 * s, 0, Math.PI); ctx.fill(); }
      else if (face === 'wide') { ctx.beginPath(); ctx.arc(x, y, 21 * s, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(x + 5 * s, y - 4 * s, 7 * s, 0, 7); ctx.fill(); ctx.fillStyle = c.eye; }
      else if (face === 'squint') { ctx.beginPath(); ctx.moveTo(x - 15 * s, y); ctx.lineTo(x + 15 * s, y); ctx.stroke(); }
      else { K.roundRect(ctx, x - 12 * s, y - 22 * s * b, 24 * s, 44 * s * b, 12 * s); ctx.fill(); }

    ctx.fillStyle = f % 30 < 18 ? '#ff3b30' : 'transparent'; ctx.beginPath(); ctx.arc(180, 58, 8, 0, 7); ctx.fill(); }
  if (who === 'lyra') { o.lean = Math.sin(t * 3) * 0.12; o.armL = 0.5 + 0.5 * Math.sin(t * 6); o.armR = 0.5 - 0.5 * Math.sin(t * 6); o.face = 'happy';
    for (let k = 0; k < 7; k++) { const a = t * 0.8 + k * 0.9, px = x + Math.cos(a) * (230 + k * 6), py = 140 + Math.sin(a * 1.3) * 80; star(px, py, 10 + (k % 3) * 4, ['#f2cf4a', '#88d779', '#a588ec'][k % 3], a); } }
  if (who === 'kestrel') { o.lean = Math.sin(t * 1.5) * 0.08; o.face = 'squint'; o.armR = 0.7;
    const mx = x + 150 + Math.sin(t * 1.5) * 30, my = 110 + Math.cos(t * 2) * 10; ctx.lineWidth = 12; ctx.strokeStyle = C21.OUT; ctx.beginPath(); ctx.moveTo(mx + 26, my + 26); ctx.lineTo(mx + 58, my + 58); ctx.stroke(); ctx.beginPath(); ctx.arc(mx, my, 36, 0, 7); ctx.fillStyle = 'rgba(96,213,216,0.25)'; ctx.fill(); ctx.lineWidth = 9; ctx.stroke();
    ctx.fillStyle = '#f2c94c'; ctx.font = "400 34px 'Lilita One',sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', mx, my + 2); }
  if (who === 'radar') { o.arms = 0.2; o.face = 'wide';
    for (let k = 0; k < 4; k++) { const q = (t * 0.6 + k / 4) % 1; ctx.globalAlpha = 1 - q; ctx.strokeStyle = '#7fd16b'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, 50, 40 + q * 300, Math.PI * 0.05, Math.PI * 0.95, true); ctx.stroke(); ctx.globalAlpha = 1; }
    [[-260, 80], [240, 120], [-190, 190], [280, 40]].forEach(([dx, dy], k) => { const on = ((t * 0.6 + k * 0.27) % 1) < 0.5; if (on) { ctx.fillStyle = '#e0352b'; ctx.beginPath(); ctx.arc(x + dx, dy, 9, 0, 7); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C21.OUT; ctx.stroke(); } }); }
  C21.bot(ctx, f, o);
}
function draw() {
  room();
  const who = viewing || result;
  if (who) hero(F, who); else lineup(F);
}
let t0 = performance.now();
function loop(now) { F = Math.floor((now - t0) / 33.3); draw(); if (!REDUCED) requestAnimationFrame(loop); }
function redraw() { if (REDUCED) { F = 40; draw(); } }

// tiny static portraits
function portrait(canvas, who) {
  const c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height);
  C21.bot(c, 0, { who, x: canvas.width / 2, y: canvas.height - 6, s: canvas.width / 440, seed: 2, face: 'happy' });
}

// ---------- screens ----------
const main = $('main');
function showStart() {
  step = -1; picks = []; result = null; viewing = null;
  main.innerHTML = `<section class="start"><p>8 quick picks. Find your crew twin.</p>
    <button class="btn" id="go" type="button">Start</button></section>`;
  $('go').onclick = () => { step = 0; showQ(); };
  redraw();
}
function dots() { return `<div class="dots" aria-label="Question ${step + 1} of ${QS.length}">${QS.map((_, i) => `<i class="${i < step ? 'on' : i === step ? 'now' : ''}"></i>`).join('')}</div>`; }
function showQ() {
  const Q = QS[step];
  main.innerHTML = `<section class="q">${dots()}
    <div class="ask"><span class="em" aria-hidden="true">${Q.em}</span><h2>${esc(Q.q)}</h2></div>
    <div class="ans">${Q.a.map((a, i) => `<button class="a" type="button" id="a${i}" data-i="${i}"><span class="em" aria-hidden="true">${a[0]}</span>${esc(a[1])}</button>`).join('')}</div></section>`;
  main.querySelectorAll('.a').forEach(b => b.onclick = () => pick(+b.dataset.i, b));
  redraw();
}
function pick(i, btn) {
  main.querySelectorAll('.a').forEach(b => b.disabled = true); btn.classList.add('picked');
  const a = QS[step].a[i]; picks[step] = i;
  jumps = { [a[2]]: F, [a[2] + '_big']: true, [a[3]]: F + 4 };
  redraw();
  setTimeout(() => { step++; if (step < QS.length) showQ(); else finish(); }, REDUCED ? 250 : 800);
}
function finish() { result = winner(); try { localStorage.setItem('crewquiz-last', JSON.stringify({ result, picks })); } catch (e) {} showResult(result, true); }

function shareLine(who) {
  const here = /unpromptedbehavior\.com$/.test(location.hostname) ? location.href.split('#')[0] : SITE;
  return `I'm ${C21.BOTS[who].name}, ${R[who].nick}, on the Unprompted Behavior crew quiz. Which bot are you? ${here}`;
}
function showResult(who, mine) {
  window.UBStickers?.give('g3');
  viewing = who;
  const r = R[who], c = C21.BOTS[who];
  let mix = '';
  if (mine && picks.length === QS.length) {
    const { s } = scores(), tot = Object.values(s).reduce((x, y) => x + y, 0);
    const top = ORDER.slice().sort((a, b) => s[b] - s[a]).slice(0, 3);
    mix = `<div class="mix"><h3>Your crew mix</h3>${top.map(k => { const p = Math.round(s[k] / tot * 100); return `<div class="bar" style="--c:${C21.BOTS[k].body}"><span>${C21.BOTS[k].name}</span><span class="tr"><i style="width:${p}%"></i></span><b>${p}%</b></div>`; }).join('')}</div>`;
  }
  const b = r.buddy;
  main.innerHTML = `<section class="res" style="--c:${c.body}">
    <div><p class="you">${mine ? 'You are' : 'Meet'}</p><p class="name">${c.name}</p></div>
    <p class="nick">${r.nick}</p>
    <p class="tag">${esc(r.tag)}</p>
    <div class="chips">${r.chips.map(x => `<span>${esc(x)}</span>`).join('')}</div>
    ${mix}
    <div class="buddy" style="--c:${C21.BOTS[b].body}"><canvas id="buddyCv" width="128" height="128" aria-hidden="true"></canvas><p>Best work buddy: <b>${C21.BOTS[b].name}</b><br>${esc(r.why)}</p></div>
    ${mine ? `<div class="share"><label for="shareTx">Share it</label><textarea id="shareTx" readonly rows="3">${esc(shareLine(who))}</textarea>
      <button class="btn" type="button" id="copy">Copy</button></div>` : ''}
    <div class="row">${mine ? '' : '<button class="btn" type="button" id="take">Take the quiz</button>'}
      ${mine ? '<button class="btn alt" type="button" id="again">Take it again</button>' : ''}
      <a class="btn disc" href="${DISCORD}" target="_blank" rel="noopener">Tell the crew on Discord</a></div>
    <div class="crew"><h3>Meet the whole crew</h3><div class="minis">${ORDER.map(k => `<button class="mini${k === who ? ' on' : ''}" type="button" data-k="${k}" aria-label="${C21.BOTS[k].name}"><canvas width="112" height="112" aria-hidden="true"></canvas>${C21.BOTS[k].name}</button>`).join('')}</div></div>
  </section>`;
  portrait($('buddyCv'), b);
  main.querySelectorAll('.mini').forEach(m => { portrait(m.querySelector('canvas'), m.dataset.k); m.onclick = () => { location.hash = m.dataset.k; }; });
  if ($('copy')) $('copy').onclick = () => {
    const tx = $('shareTx'), done = () => { $('copy').textContent = 'Copied'; setTimeout(() => { if ($('copy')) $('copy').textContent = 'Copy'; }, 1600); };
    const sel = () => { tx.focus(); tx.select(); $('copy').textContent = 'Selected. Press copy.'; };
    try { navigator.clipboard.writeText(tx.value).then(done, sel); } catch (e) { sel(); }
  };
  if ($('again')) $('again').onclick = () => { if (location.hash) history.replaceState(null, '', location.pathname + location.search); showStart(); };
  if ($('take')) $('take').onclick = () => { if (location.hash) history.replaceState(null, '', location.pathname + location.search); showStart(); };
  redraw();
  if (!mine) window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}

function route() {
  const k = location.hash.slice(1);
  if (ORDER.includes(k)) showResult(k, k === result);
  else if (result) showResult(result, true);
  else showStart();
}
window.addEventListener('hashchange', route);
route();
if (REDUCED) redraw(); else requestAnimationFrame(loop);
})();
</script>

</body></html>
