<script>
// kit.js - drawing helpers shared by every template. Also records where text lands on each
// frame so the self-check can tell if words sit under the Shorts buttons or are too small.
const K = (() => {
  const boxes = [];
  const FONT = "'Inter Display','Inter','Segoe UI Black','Arial Black',sans-serif";

  // Shorts app covers the top strip, the bottom caption/title area and the right-hand buttons.
  // On a Short the like/comment buttons only sit on the right below the middle.
  function safeZone(w, h) {
    if (h > w) return { x0: 50, y0: Math.round(h * 0.09), x1: w - 50, y1: Math.round(h * 0.78), btnX: w - 160, btnY: Math.round(h * 0.52) };
    return { x0: Math.round(w * 0.05), y0: Math.round(h * 0.05), x1: Math.round(w * 0.95), y1: Math.round(h * 0.95) };
  }

  function font(size, weight = 900, family = FONT) { return `${weight} ${Math.round(size)}px ${family}`; }

  // Fit text to a width by shrinking the size, never below min.
  function fit(ctx, str, maxW, size, weight = 900, min = 40, family = FONT, track = 0) {
    let s = size;
    for (; s > min; s -= 2) {
      ctx.font = font(s, weight, family);
      if (ctx.measureText(str).width + track * s * str.length <= maxW) break;
    }
    return s;
  }

  // Draw text and record its box (in canvas pixels, after the current transform).
  function text(ctx, str, x, y, o = {}) {
    const size = o.size || 80, weight = o.weight || 900;
    ctx.save();
    ctx.font = font(size, weight, o.family);
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.track) ctx.letterSpacing = `${o.track * size}px`;
    const w = ctx.measureText(str).width;
    if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur ?? size * 0.08; ctx.shadowOffsetY = o.shadowY ?? size * 0.06; }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeWidth || size * 0.14; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); ctx.shadowColor = 'transparent'; }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
    if (!o.noRecord && (o.alpha ?? 1) > 0.5) {
      const left = ctx.textAlign === 'center' ? x - w / 2 : ctx.textAlign === 'right' ? x - w : x;
      const m = ctx.getTransform();
      const pts = [[left, y - size / 2], [left + w, y - size / 2], [left, y + size / 2], [left + w, y + size / 2]]
        .map(([px, py]) => [m.a * px + m.c * py + m.e, m.b * px + m.d * py + m.f]);
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      boxes.push({ str, x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys), px: size * Math.hypot(m.c, m.d) });
    }
    ctx.restore();
    return w;
  }

  // Cached noise texture (grain, rust, yarn fuzz). Same seed, same picture.
  const cache = {};
  function grain(w, h, seed, base, spots, amount = 0.5) {
    const key = [w, h, seed, base, spots.join(), amount].join('|');
    if (cache[key]) return cache[key];
    const c = new OffscreenCanvas(w, h), g = c.getContext('2d'), r = M.rng(seed);
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    // big soft stains (blurred so they never look like polka dots)
    g.filter = 'blur(24px)';
    for (let i = 0; i < (w * h) / 40000 * amount + 3; i++) {
      g.globalAlpha = 0.10 + r() * 0.16; g.fillStyle = spots[Math.floor(r() * spots.length)];
      const rr = 40 + r() * 180; g.beginPath(); g.ellipse(r() * w, r() * h, rr, rr * (0.3 + r() * 0.6), r() * 3, 0, 7); g.fill();
    }
    g.filter = 'none';
    // fine pitting
    for (let i = 0; i < (w * h) / 300 * amount; i++) {
      g.globalAlpha = 0.08 + r() * 0.2; g.fillStyle = spots[Math.floor(r() * spots.length)];
      const rr = 0.8 + r() * r() * 5; g.beginPath(); g.arc(r() * w, r() * h, rr, 0, 7); g.fill();
    }
    g.filter = 'none'; g.globalAlpha = 1;
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    return (cache[key] = c);
  }

  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  function rivet(ctx, x, y, r, s) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, s.highlight); g.addColorStop(0.6, s.metal); g.addColorStop(1, s.dark);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }

  // Sparks burst from (x, y) starting at frame start. Deterministic.
  function sparks(ctx, f, start, x, y, seed, color, n = 26, spread = Math.PI * 2, dir = -Math.PI / 2) {
    const d = f - start; if (d < 0 || d > 22) return;
    const r = M.rng(seed);
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = dir + (r() - 0.5) * spread, sp = 18 + r() * 34, life = 10 + r() * 12;
      if (d > life) continue;
      const t = d / life, px = x + Math.cos(a) * sp * d, py = y + Math.sin(a) * sp * d + 1.2 * d * d;
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = color; ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(a) * sp * 0.8, py - Math.sin(a) * sp * 0.8 - 2.4 * d); ctx.stroke();
    }
    ctx.restore();
  }

  // Stand-in for real gameplay under overlays in previews only (never a real clip, no players).
  function footagePlaceholder(ctx, w, h, f) {
    const g = ctx.createLinearGradient(0, 0, w * 0.3, h);
    g.addColorStop(0, '#5d6b73'); g.addColorStop(0.55, '#7a8466'); g.addColorStop(1, '#3d3a2f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
    for (let i = 0; i < 6; i++) { const x = ((i * 397 + f * 3) % (w + 400)) - 200; ctx.fillRect(x, h * 0.55, 140 + i * 30, h * 0.45); }
    ctx.restore();
  }

  return { boxes, FONT, safeZone, font, fit, text, grain, roundRect, rivet, sparks, footagePlaceholder };
})();

// motion.js - the twelve motions from the motion pack spec (motion-pack-20261021/SPEC.md),
// written for the browser. Every function takes frame numbers (30 fps) and returns plain numbers.
// No drawing in here.
const M = (() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeIn = t => Math.pow(clamp(t), 3);
  const easeInOut = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const prog = (f, start, len) => clamp((f - start) / Math.max(1, len));

  // seeded random so every render of the same brief is identical
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // 1 pop-in: 0 -> 1.12 over 5 f, 1.12 -> 1 over 3 f, opacity over the first 3 f
  function popIn(f, start) {
    const d = f - start;
    if (d < 0) return { scale: 0, alpha: 0 };
    const scale = d < 5 ? lerp(0, 1.12, easeOut(d / 5)) : lerp(1.12, 1, easeOut((d - 5) / 3));
    return { scale, alpha: clamp(d / 3) };
  }

  // 2 slide: 4 f anticipation (3% the wrong way), n f travel, 2 f overshoot (3%), 2 f settle
  function slide(f, start, from, to, n = 12) {
    const d = f - start, dist = to - from;
    if (d <= 0) return from;
    if (d < 4) return from - dist * 0.03 * easeOut(d / 4);
    if (d < 4 + n) return lerp(from - dist * 0.03, to + dist * 0.03, easeOut((d - 4) / n));
    if (d < 4 + n + 2) return to + dist * 0.03;
    return lerp(to + dist * 0.03, to, easeOut((d - 4 - n - 2) / 2));
  }

  // 3 drop-bounce: 6 f fall (ease-in), contact on frame 7, bounce up 15% and back
  function dropBounce(f, start, fromY, toY) {
    const d = f - start, h = toY - fromY;
    if (d <= 0) return { y: fromY, contact: false };
    if (d < 6) return { y: lerp(fromY, toY, easeIn(d / 6)), contact: false };
    if (d < 7) return { y: toY, contact: true };
    if (d < 10) return { y: toY - h * 0.15 * easeOut((d - 7) / 3), contact: false };
    if (d < 13) return { y: toY - h * 0.15 * (1 - easeIn((d - 10) / 3)), contact: false };
    return { y: toY, contact: false };
  }

  // 4 punch-zoom: 1.00 -> amt over len f (ease-out), then hold
  const punchZoom = (f, start, amt = 1.08, len = 6) => f < start ? 1 : lerp(1, amt, easeOut((f - start) / len));

  // 5 hit: impact frame, then shake 8, 8, 4, 4, 2, 2 px alternating, then still
  function hit(f, start) {
    const d = f - start;
    if (d < 0 || d > 6) return { flash: 0, dx: 0, dy: 0 };
    const amp = [0, 8, 8, 4, 4, 2, 2][d], sign = d % 2 ? 1 : -1;
    return { flash: d === 0 ? 1 : 0, dx: amp * sign, dy: amp * 0.5 * -sign };
  }

  // 6 squash-stretch around a contact frame. Never on text.
  function squash(f, contact) {
    const d = f - contact;
    if (d < -2 || d > 3) return { sx: 1, sy: 1 };
    if (d < 0) return { sx: 0.92, sy: 1.10 };
    if (d === 0) return { sx: 1.12, sy: 0.88 };
    const t = easeOut(d / 3);
    return { sx: lerp(1.12, 1, t), sy: lerp(0.88, 1, t) };
  }

  // 7 blink: 2 f closing, 1 closed, 1 opening; gap 90-150 f, different per character
  function blink(f, seed) {
    const r = rng(seed); let at = Math.floor(30 + r() * 60);
    while (at + 4 < f) at += 90 + Math.floor(r() * 60);
    const d = f - at;
    if (d < 0 || d > 3) return 1;
    return [0.5, 0.1, 0.1, 0.6][d];
  }

  // 8 idle: 1 px breathing on a 60 f wave, +-0.5 degree on a 90 f wave
  const idle = (f, seed = 0) => ({
    dy: Math.sin((f + seed * 17) / 60 * Math.PI * 2),
    rot: Math.sin((f + seed * 29) / 90 * Math.PI * 2) * 0.5 * Math.PI / 180,
  });

  // 10 word-pop: each word 0.8 -> 1.05 -> 1.00 over 4 f, next word 3 f later
  function wordPop(f, start, i, gap = 3) {
    const d = f - (start + i * gap);
    if (d < 0) return { scale: 0.8, alpha: 0 };
    const scale = d < 2 ? lerp(0.8, 1.05, easeOut(d / 2)) : lerp(1.05, 1, easeOut((d - 2) / 2));
    return { scale, alpha: clamp(d / 2) };
  }

  // 11 whip: out over 4 f ease-in or in over 4 f ease-out, with a horizontal blur amount
  const whipOut = (f, start, width) => { const t = prog(f, start, 4); return { dx: -width * easeIn(t), blur: t > 0 && t < 1 ? 12 : 0 }; };
  const whipIn = (f, start, width) => { const t = prog(f, start, 4); return { dx: width * (1 - easeOut(t)), blur: t > 0 && t < 1 ? 12 : 0 }; };

  return { clamp, lerp, easeOut, easeIn, easeInOut, prog, rng, popIn, slide, dropBounce, punchZoom, hit, squash, blink, idle, wordPop, whipOut, whipIn };
})();

// crew21.js - the v21 crew (as on the website "Meet the crew"), drawn in code so it stays sharp at 1080p.
// Feet at (o.x, o.y), o.s scale (1 = ~340 px tall). Round mitts only, never hands.
// Each bot has its own topper: Wrench tool belt, Rowan glasses + bow tie, Skippy headset, Bernard camera,
// Lyra star + cable, Kestrel goggles + feathers, Radar dish.
const C21 = (() => {
  const OUT = '#0f1318';
  const BOTS = {
    wrench:  { name: 'WRENCH',  body: '#f39732', dark: '#b8661a', leg: '#6f441e', eye: '#4fd1d4', ball: '#4fd1d4' },
    rowan:   { name: 'ROWAN',   body: '#60d5d8', dark: '#2f9598', leg: '#316567', eye: '#eef3f7', ball: '#f28c1c' },
    skippy:  { name: 'SKIPPY',  body: '#f3ce5c', dark: '#c19a2a', leg: '#7b621f', eye: '#60d5d8', ball: '#e0352b' },
    bernard: { name: 'BERNARD', body: '#a588ec', dark: '#7258c0', leg: '#4c3d7a', eye: '#f4f4f4', ball: '#e0352b' },
    lyra:    { name: 'LYRA',    body: '#88d779', dark: '#56a548', leg: '#3f7037', eye: '#f4f4f4', ball: '#f2cf4a' },
    kestrel: { name: 'KESTREL', body: '#6b88bc', dark: '#435f93', leg: '#354461', eye: '#f2c94c', ball: '#f2cf4a' },
    radar:   { name: 'RADAR',   body: '#d4dae1', dark: '#9aa3ad', leg: '#585e66', eye: '#7fd16b', ball: '#cbd1d7' },
  };
  const ORDER = ['wrench', 'rowan', 'skippy', 'bernard', 'lyra', 'kestrel', 'radar'];
  const P = (ctx, fill, lw) => { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); };

  function eyes(ctx, f, o, c, s) {
    const face = o.face || 'normal', b = face === 'normal' ? M.blink(f, o.seed || 1) : 1;
    ctx.save(); ctx.fillStyle = c.eye; ctx.strokeStyle = c.eye; ctx.lineCap = 'round';
    ctx.shadowColor = c.eye; ctx.shadowBlur = 18 * s;
    for (const side of [-1, 1]) {
      const x = side * 34 * s, y = -186 * s;
      ctx.lineWidth = 9 * s;
      if (face === 'happy') { ctx.beginPath(); ctx.arc(x, y + 10 * s, 16 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      else if (face === 'tired') { ctx.beginPath(); ctx.moveTo(x - 15 * s, y + 2 * s); ctx.lineTo(x + 15 * s, y + 2 * s); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y + 2 * s, 12 * s, 0, Math.PI); ctx.fill(); }
      else if (face === 'wide') { ctx.beginPath(); ctx.arc(x, y, 21 * s, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(x + 5 * s, y - 4 * s, 7 * s, 0, 7); ctx.fill(); ctx.fillStyle = c.eye; }
      else if (face === 'squint') { ctx.beginPath(); ctx.moveTo(x - 15 * s, y); ctx.lineTo(x + 15 * s, y); ctx.stroke(); }
      else { K.roundRect(ctx, x - 12 * s, y - 22 * s * b, 24 * s, 44 * s * b, 12 * s); ctx.fill(); }
    }
    // mouth
    ctx.lineWidth = 6 * s; ctx.beginPath();
    if (face === 'wide') ctx.ellipse(0, -152 * s, 9 * s, 11 * s, 0, 0, 7), ctx.stroke();
    else ctx.arc(0, -160 * s, 11 * s, Math.PI * 0.15, Math.PI * 0.85), ctx.stroke();
    ctx.restore();

const KF = [
  [0.0, 150, 8.4, 1.6, 150, 3.4, 1.7],
  [2.3, 147, 9.6, 2.4, 150, 3.0, 2.3],
  [4.6, 120, 22, 13, 110, 2, 1.5],
  [6.2, 175, 15, 6, 180, 6, 1.5],
  [7.1, 180, 3.4, 1.85, 180, 8.4, 1.5],
  [8.8, 186, 3.4, 1.85, 182, 8.4, 1.5],
  [9.3, 220, 3.4, 1.85, 220, 8.4, 1.5],
  [10.8, 226, 3.4, 1.85, 222, 8.4, 1.5],
  [11.3, 260, 3.4, 1.85, 260, 8.4, 1.5],
  [12.8, 266, 3.4, 1.85, 262, 8.4, 1.5],
  [13.3, 300, 3.4, 1.85, 300, 8.4, 1.5],
  [14.6, 306, 3.4, 1.85, 302, 8.4, 1.5],
  [15.6, 330, 5.6, treeTop + 1.3, 0, 0, treeTop + 1.05],
  [17.0, 340, 6.0, treeTop + 1.4, 0, 0, treeTop + 1.1],
];
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function shot(t) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++;
  const a = KF[i], b = KF[i + 1], k = ease(clamp((t - a[0]) / (b[0] - a[0])));
  const L = j => a[j] + (b[j] - a[j]) * k;
  camPos.copy(polar(L(1), L(2), L(3)));
  // look target: blend in cartesian so passing through the centre is smooth
  camLook.copy(polar(a[4], a[5], a[6])).lerp(polar(b[4], b[5], b[6]), k);
}

function toast(msg, html) { const tb = $('toast'); if (!tb) return; tb.innerHTML = html || ''; if (!html) tb.textContent = msg; tb.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => tb.hidden = true, 6000); }
function doorLen(n) { const D = DOORS[n]; return D.gag === 'home' ? BUB[D.who][1] - BUB[D.who][0] + 2.4 : D.gag === 'finale' ? 7 : BUB_END + 0.6; }
function openDoor(n) {
  if (!unlocked(n)) return toast(`Door ${n} opens on December ${n}.`);
  setMode('drone'); door = n; doorAt = nowT; opened.add(n);
  window.UBStickers?.give('d'+n); if([1,2,3,4,5,6,7].every(i=>opened.has(i)))window.UBStickers?.give('g4');
  if (n === 24) finaleAt = nowT + 0.9;
  try { localStorage.setItem('market-opened', JSON.stringify([...opened])); } catch (e) {}
  paintDoors();
}
function paintDoors() {
  document.querySelectorAll('[data-door]').forEach(b => { const n = +b.dataset.door;
    b.classList.toggle('open', opened.has(n)); b.classList.toggle('locked', !unlocked(n)); b.setAttribute('aria-pressed', n === door); });
  const fc = $('found'); if (fc) fc.textContent = `${opened.size} / 24 doors opened`;
}
try { JSON.parse(localStorage.getItem('market-opened') || '[]').forEach(n => opened.add(n)); } catch (e) {}
function setMode(m) { mode = m; document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m)); }
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { setMode(b.dataset.mode); door = 0; if (b.dataset.mode === 'short') t0 = performance.now(); });
document.querySelectorAll('[data-door]').forEach(b => b.onclick = () => openDoor(+b.dataset.door));
el.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; moved = 0; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6) { if (mode !== 'drone') setMode('drone'); door = 0; orbA -= dx * 0.3; orbE = clamp(orbE + dy * 0.004, 0.08, 1.3); } drag = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', e => { const was = drag; drag = null; if (!was || moved > 6) return;
  const r = el.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...Object.values(CREW).map(c => c.s.sp), ...STALLS.map(s => s.mesh)]);
  const tapBot = k => { const n = [1, 2, 3, 4, 5, 6, 7].find(i => DOORS[i].who === k); openDoor(n); };
  if (hits.length) { const st = STALLS.find(s => s.mesh === hits[0].object);
    if (st) return toast('', `<span>${st.sign}</span> <a href="${SHOP + st.shop}" target="_blank" rel="noopener">Shop: ${st.item} →</a>`);
    return tapBot(Object.keys(CREW).find(k => CREW[k].s.sp === hits[0].object)); }
  let best = null, bd = 70; // forgiving tap: nearest bot within 70 px
  for (const k in CREW) { const v = CREW[k].pos.clone().add(new THREE.Vector3(0, 0.8, 0)).project(camera);
    const d = Math.hypot(r.left + (v.x + 1) / 2 * r.width - e.clientX, r.top + (1 - v.y) / 2 * r.height - e.clientY); if (v.z < 1 && d < bd) { bd = d; best = k; } }
  if (best) tapBot(best); });
el.addEventListener('wheel', e => { e.preventDefault(); setMode('drone'); door = 0; orbR = clamp(orbR * (1 + e.deltaY * 0.001), 6, 45); }, { passive: false });
setMode(mode); paintDoors();
{ const it = $('intro'), go = () => { if (it) it.classList.add('gone'); }; if ($('enter')) $('enter').onclick = go; if (it) it.addEventListener('pointerdown', go); }

// camera for a door: in front of where the bot stands
function doorCam(n, p) {
  const D = DOORS[n], a = Math.atan2(p.x, p.z) / D2R, r = Math.hypot(p.x, p.z);
  if (D.gag === 'topper') return [polar(312, 10.6, 1.0), new THREE.Vector3(0, 4.2, 0)];
  if (D.gag === 'home') { if (D.who === 'wrench' || D.who === 'lyra') { shot((BUB[D.who][0] + BUB[D.who][1]) / 2); return [camPos.clone(), camLook.clone()]; } }
  if (r > 6) return [polar(a + 4, r - 5, 1.85), polar(a, r, 1.5)];
  return [polar(a - 6, r + 3.4, 2.0), polar(a, r, 1.5)];
}

// ---------- frame ----------
const col = new THREE.Color();
const IDLE = { wrench: 5, radar: 8, skippy: 3, rowan: 6, bernard: 5, kestrel: 5, lyra: 5 };
const lerpV = new THREE.Vector3(), lerpL = new THREE.Vector3(), orbP = new THREE.Vector3(), orbL = new THREE.Vector3(0, 2.5, 0);
const snowMat = scene.children.find(o => o.isPoints).material;
let camW = 0, lastT = 0;
function frame(t) {
  nowT = t;
  if (mode === 'door') { door = DOOR_SHORT; doorAt = -1.2; if (door === 24) finaleAt = -1.2; }   // door Short: action already moving at frame 0
  const D = door ? DOORS[door] : null, e = t - doorAt - 0.9;
  if (D && mode === 'drone' && t - doorAt > doorLen(door) + 0.9) { const p = D.who === 'all' ? null : CREW[D.who].pos; orbA = p ? Math.atan2(p.x, p.z) / D2R : orbA; orbE = 0.45; door = 0; }
  // each bot's state for this frame
  const st = {};
  for (const k in CREW) {
    let bt = IDLE[k] + (t % 1), gag = null, pos = HOME[k], vis = true;
    if (mode === 'short') bt = t % T;
    else if (D && D.who === k && e >= 0) {
      const lead = k === 'wrench' ? 0.4 : 0.15;
      if (D.gag === 'home') bt = Math.min(BUB[k][0] - lead + e, BUB[k][1] - 0.01);
      else { gag = D.gag; pos = D.path ? D.path(e) : D.at || HOME[k]; }
    } else if (D && D.who === k && D.gag !== 'home') pos = D.path ? D.path(0) : D.at || HOME[k];
    if (D && D.hide && D.hide.includes(k)) vis = false;
    st[k] = { bt, gag, pos, vis };
  }
  const wt = st.wrench.bt, lit = wt < 0.3 ? 0.05 : wt < 0.6 ? (Math.floor(wt * 40) % 2 ? 1 : 0.2) : 1;
  lightIdx.forEach(L => { const b = lit * (0.55 + 0.45 * Math.sin(t * L.sp + L.ph)); col.copy(L.col).multiplyScalar(0.15 + b); glowMesh.setColorAt(L.i, col); });
  garland.forEach(L => { const b = lit * (0.5 + 0.5 * Math.sin(t * 4 - L.ph)); col.copy(L.col).multiplyScalar(0.12 + b * 0.9); glowMesh.setColorAt(L.i, col); });
  fireIdx.forEach((i, n) => { col.set('#ff7a1a').multiplyScalar(0.6 + 0.5 * Math.abs(Math.sin(t * 9 + n * 1.7))); glowMesh.setColorAt(i, col); });
  glowMesh.instanceColor.needsUpdate = true;
  treeLight.intensity = 60 * lit;
  halos.forEach(h => { const fl = h.group === 'lyra' ? (0.8 + 0.2 * Math.sin(t * 3)) * (wt > 0.5 ? 1 : 0.3) : 0.92 + 0.08 * Math.sin(t * 7 + h.ph); h.s.scale.setScalar(h.base * fl); });
  snowMat.size = D && D.gag === 'snowok' && e > 1.8 ? 0.28 : 0.14;
  for (let i = 0; i < SN; i++) { const s = snowSeed[i];
    snowPos[i * 3] = s[0] + Math.sin(t * 0.7 + s[4]) * 0.6; snowPos[i * 3 + 1] = ((s[1] - t * s[3]) % 24 + 24) % 24; snowPos[i * 3 + 2] = s[2] + Math.cos(t * 0.5 + s[4]) * 0.6; }
  snowGeo.attributes.position.needsUpdate = true;
  const fin = (mode === 'drone' || mode === 'door') && t > finaleAt && t < finaleAt + 7;
  const TEASE = QS.has('teaser');
  const far = mode === 'drone' && !door;
  for (const k in CREW) { const S = st[k], C = CREW[k];
    C.pos.copy(S.pos); C.s.sp.position.copy(S.pos); C.s.sp.visible = S.vis;
    drawBot(k, t, S.bt, S.gag, e);
    const B = C.b; let on, txt, p0;
    if (TEASE) { on = true; p0 = 1; txt = BUB[k][2]; }
    else if (fin) { on = true; p0 = t - finaleAt; txt = k === 'rowan' ? 'MERRY CHRISTMAS.\n(WE CHECKED.)' : k === 'wrench' ? 'TREE: LIT.\nME: 4%.' : 'MERRY\nCHRISTMAS!'; }
    else if (S.gag) { on = e >= BUB_AT && e <= BUB_END + 0.6; p0 = e - BUB_AT; txt = typeof D.text === 'function' ? D.text(e) : D.text; }
    else { const [a, b, t0x] = BUB[k]; on = S.bt >= a && S.bt <= b && (mode === 'short' || (D && D.who === k)); p0 = S.bt - a; txt = t0x; }
    B.sp.visible = on && S.vis;
    if (on) { drawBubble(B, txt); const p = clamp(p0 / 0.18), pop = p < 1 ? 0.6 + 0.4 * p + Math.sin(p * Math.PI) * 0.18 : 1;
      const big = far || (fin && mode !== 'short'), sc = (big ? 2.6 : 1.12) * pop; B.sp.scale.set(sc * 560 / 300, sc, 1);
      const up = k === 'lyra' && S.pos.y > 5 ? (big ? 2.3 : 2.75) : 2.38 + (big ? 0.9 : 0);
      B.sp.position.copy(S.pos).add(new THREE.Vector3(0, up, 0)); }
  }
  // setup caption: the phrase the bot is about to take literally
  const cap = $('setup'); if (cap && !CAPTURE) cap.classList.add('site');
  if (cap) { const show = D && (mode === 'door' ? t < 2.2 : t - doorAt < 3.1); cap.hidden = !show; if (show && cap.textContent !== D.setup) cap.textContent = D.setup; }
  const tag = $('doortag'); if (tag) { const show = mode === 'door' && t > 7; tag.hidden = !show; if (show) tag.textContent = `DOOR ${door} · DEC ${door}`; }
  // camera
  if (mode === 'short') { shot(t % T); camera.position.copy(camPos); camera.lookAt(camLook); lastT = t; }
  else {
    if (!drag && !door) orbA += 0.06;
    if (TEASE) { orbA = 120 + t * 22.5; orbE = 0.5; orbR = 23; }
    if (fin && !drag) { orbR += (25 - orbR) * 0.05; orbE += (0.42 - orbE) * 0.05; }
    let w;
    if (mode === 'door') { // door Short: hold the close-up, then rise to the drone view
      orbA = Math.atan2(st[D.who === 'all' ? 'wrench' : D.who].pos.x, st[D.who === 'all' ? 'wrench' : D.who].pos.z) / D2R + (t - 7) * 6; orbE = 0.5; orbR = 22;
      w = D.gag === 'finale' ? 0 : 1 - ease(clamp((t - 7) / 2.6));
    } else { const dt = clamp(t - lastT, 0, 0.1); camW = clamp(camW + (door && D.gag !== 'finale' ? dt : -dt) / 1.1); w = ease(camW); }
    orbP.copy(polar(orbA, orbR * Math.cos(orbE), 2 + orbR * Math.sin(orbE)));
    if (door && D.gag !== 'finale') { const [fp, fl] = doorCam(door, CREW[D.who].pos); lerpV.copy(fp); lerpL.copy(fl); }
    lastT = t; camera.position.copy(orbP).lerp(lerpV, w); camera.lookAt(orbL.clone().lerp(lerpL, w));
  }
  renderer.render(scene, camera);
}

function resize() {
  const w = W0 || innerWidth, h = H0 || innerHeight;
  renderer.setSize(w, h, !CAPTURE); camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let t0 = performance.now();
window.renderAt = t => frame(t); window.__door = n => openDoor(n);
window.__proj = k => { const v = CREW[k].pos.clone().add(new THREE.Vector3(0, 0.8, 0)).project(camera), r = el.getBoundingClientRect(); return [r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height]; };            // used by the frame-by-frame recorder
if (!CAPTURE) { const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
else frame(0);
window.__ready = true;
})();
</script>
<script>if(location.search.includes("capture"))document.body.classList.add("capture"),document.querySelector(".bar").style.display="none",document.querySelector(".doors").style.display="none",document.getElementById("intro").remove()</script>
