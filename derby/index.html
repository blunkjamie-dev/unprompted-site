<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew Wind-Up Derby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap">
<style>
/* One full-screen canvas game on a night-market table. Single dark look by choice (it is night at the market). */
:root{
  --night:#0a1230; --panel:#151d3a; --line:#33405a;
  --ink:#f4f6fb; --dim:#b3bfd6;
  --gold:#f2cf4a; --red:#e0352b; --orange:#f39732; --cream:#fff6dc; --green:#1f5a37;
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;display:block;touch-action:none}
.hudbtns{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:3}
.hudbtns button{width:44px;height:44px;border-radius:12px;border:3px solid #0f1318;background:var(--cream);color:#14181d;font-family:var(--display);font-size:16px;cursor:pointer;box-shadow:0 4px 0 #050914}
.hudbtns button[aria-pressed="false"]{opacity:.55}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(6,10,28,.55);z-index:4;overflow-y:auto;touch-action:pan-y}
.sheet{width:min(560px,100%);background:var(--panel);border:3px solid #0f1318;border-radius:20px;padding:18px 18px 16px;box-shadow:0 8px 0 #050914,0 0 0 6px rgba(242,207,74,.18);text-align:center;margin:auto}
.draft{display:inline-block;font-family:var(--display);font-size:12px;color:#14181d;background:var(--orange);border:2px solid #0f1318;border-radius:8px;padding:3px 8px;margin:0 0 6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1;margin:4px 0 4px;color:var(--gold);-webkit-text-stroke:2px #0f1318;paint-order:stroke fill;text-shadow:0 4px 0 #0f1318}
.sub{margin:0 0 12px;color:var(--dim);font-weight:800}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.pick button{position:relative;background:#1f2a50;border:3px solid #0f1318;border-radius:14px;padding:4px 2px 6px;cursor:pointer;color:var(--ink);font:900 12px/1 var(--body);box-shadow:0 3px 0 #050914}
.pick button canvas{display:block;width:100%;height:auto}
.pick button[aria-pressed="true"]{background:var(--gold);color:#14181d;outline:3px solid #fff;outline-offset:1px}
.pick button small{display:block;font-weight:800;font-size:10px;opacity:.8;margin-top:2px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:22px;color:#14181d;background:var(--gold);border:3px solid #0f1318;border-radius:14px;padding:12px 26px;cursor:pointer;box-shadow:0 5px 0 #0f1318;margin:4px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0f1318}
.ghost{font:900 15px var(--body);color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;margin:4px}
.how{list-style:none;padding:0;margin:12px 0 4px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.how li{background:#0f1733;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800}
.how li b{color:var(--gold)}
.foot{font-size:12px;color:var(--dim);margin:8px 0 0}
.res .place{font-family:var(--display);font-size:clamp(46px,14vw,72px);line-height:1;margin:4px 0;color:var(--gold);-webkit-text-stroke:2px #0f1318;paint-order:stroke fill;text-shadow:0 4px 0 #0f1318}
.res .quip{font-family:var(--display);font-size:20px;margin:6px 0 10px}
.board{list-style:none;margin:0 auto 10px;padding:0;max-width:340px;text-align:left}
.board li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;font-weight:900;font-variant-numeric:tabular-nums}
.board li:nth-child(odd){background:#0f1733}
.board li.me{outline:2px solid var(--gold)}
.board .dot{width:14px;height:14px;border-radius:50%;border:2px solid #0f1318;flex:none}
.board .t{margin-left:auto;color:var(--dim)}
.stamp{display:inline-block;font-family:var(--display);font-size:13px;color:#fff;background:var(--red);border:2px solid #0f1318;border-radius:8px;padding:3px 8px;transform:rotate(-4deg)}
.msg{font-size:13px;color:var(--dim);min-height:1em;margin:6px 0 0}
</style>
<div id="app">
  <canvas id="cv" aria-label="Crew Wind-Up Derby. Hold to wind your toy, let go to race."></canvas>
  <div class="hudbtns" id="hud" hidden>
    <button id="bSound" type="button" aria-label="Sound" aria-pressed="true">♪</button>
    <button id="bQuit" type="button" aria-label="Back to start">✕</button>
  </div>
  <section class="panel" id="title">
    <div class="sheet">
      <p class="draft">SNOW CUP</p>
      <h1>CREW WIND-UP DERBY</h1>
      <p class="sub">Four toy bots. One market table. Track of the day <b id="dNum">#1</b>.</p>
      <div class="pick" id="pick" role="group" aria-label="Pick your bot"></div>
      <button class="big" id="go" type="button">WIND UP!</button>
      <ul class="how">
        <li><b>Hold</b> = wind the key</li><li><b>Let go</b> = run</li><li>Let go in <b>gold</b> = TURBO</li><li>Too far = <b>SPROING</b></li><li>Grab peppermints, skip cocoa</li>
      </ul>
      <p class="foot">Tap and hold anywhere, or hold Space.</p>
    </div>
  </section>
  <section class="panel" id="over" hidden>
    <div class="sheet res" role="dialog" aria-labelledby="place">
      <span class="stamp" id="stamp" hidden>NEW BEST</span>
      <p class="place" id="place">1st</p>
      <p class="quip" id="quip">Fixed it. Fast.</p>
      <ol class="board" id="board"></ol>
      <div><button class="big" id="again" type="button">RACE AGAIN</button></div>
      <div><button class="ghost" id="change" type="button">Change bot</button><button class="ghost" id="share" type="button">Copy result</button></div>
      <p class="msg" id="msg" aria-live="polite"></p>
    </div>
  </section>
</div>
<script src="/unprompted-site/ub-stickers.js"></script><script>
// motion.js - the twelve motions from the motion pack spec (motion-pack-20261021/SPEC.md),
// written for the browser. Every function takes frame numbers (30 fps) and returns plain numbers.
// No drawing in here.
const M = (() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeIn = t => Math.pow(clamp(t), 3);
  const easeInOut = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const prog = (f, start, len) => clamp((f - start) / Math.max(1, len));

  // seeded random so every render of the same brief is identical
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // 1 pop-in: 0 -> 1.12 over 5 f, 1.12 -> 1 over 3 f, opacity over the first 3 f
  function popIn(f, start) {
    const d = f - start;
    if (d < 0) return { scale: 0, alpha: 0 };
    const scale = d < 5 ? lerp(0, 1.12, easeOut(d / 5)) : lerp(1.12, 1, easeOut((d - 5) / 3));
    return { scale, alpha: clamp(d / 3) };
  }

  // 2 slide: 4 f anticipation (3% the wrong way), n f travel, 2 f overshoot (3%), 2 f settle
  function slide(f, start, from, to, n = 12) {
    const d = f - start, dist = to - from;
    if (d <= 0) return from;
    if (d < 4) return from - dist * 0.03 * easeOut(d / 4);
    if (d < 4 + n) return lerp(from - dist * 0.03, to + dist * 0.03, easeOut((d - 4) / n));
    if (d < 4 + n + 2) return to + dist * 0.03;
    return lerp(to + dist * 0.03, to, easeOut((d - 4 - n - 2) / 2));
  }

  // 3 drop-bounce: 6 f fall (ease-in), contact on frame 7, bounce up 15% and back
  function dropBounce(f, start, fromY, toY) {
    const d = f - start, h = toY - fromY;
    if (d <= 0) return { y: fromY, contact: false };
    if (d < 6) return { y: lerp(fromY, toY, easeIn(d / 6)), contact: false };
    if (d < 7) return { y: toY, contact: true };
    if (d < 10) return { y: toY - h * 0.15 * easeOut((d - 7) / 3), contact: false };
    if (d < 13) return { y: toY - h * 0.15 * (1 - easeIn((d - 10) / 3)), contact: false };
    return { y: toY, contact: false };
  }

  // 4 punch-zoom: 1.00 -> amt over len f (ease-out), then hold
  const punchZoom = (f, start, amt = 1.08, len = 6) => f < start ? 1 : lerp(1, amt, easeOut((f - start) / len));

  // 5 hit: impact frame, then shake 8, 8, 4, 4, 2, 2 px alternating, then still
  function hit(f, start) {
    const d = f - start;
    if (d < 0 || d > 6) return { flash: 0, dx: 0, dy: 0 };
    const amp = [0, 8, 8, 4, 4, 2, 2][d], sign = d % 2 ? 1 : -1;
    return { flash: d === 0 ? 1 : 0, dx: amp * sign, dy: amp * 0.5 * -sign };
  }

  // 6 squash-stretch around a contact frame. Never on text.
  function squash(f, contact) {
    const d = f - contact;
    if (d < -2 || d > 3) return { sx: 1, sy: 1 };
    if (d < 0) return { sx: 0.92, sy: 1.10 };
    if (d === 0) return { sx: 1.12, sy: 0.88 };
    const t = easeOut(d / 3);
    return { sx: lerp(1.12, 1, t), sy: lerp(0.88, 1, t) };
  }

  // 7 blink: 2 f closing, 1 closed, 1 opening; gap 90-150 f, different per character
  function blink(f, seed) {
    const r = rng(seed); let at = Math.floor(30 + r() * 60);
    while (at + 4 < f) at += 90 + Math.floor(r() * 60);
    const d = f - at;
    if (d < 0 || d > 3) return 1;
    return [0.5, 0.1, 0.1, 0.6][d];
  }

  // 8 idle: 1 px breathing on a 60 f wave, +-0.5 degree on a 90 f wave
  const idle = (f, seed = 0) => ({
    dy: Math.sin((f + seed * 17) / 60 * Math.PI * 2),
    rot: Math.sin((f + seed * 29) / 90 * Math.PI * 2) * 0.5 * Math.PI / 180,
  });

  // 10 word-pop: each word 0.8 -> 1.05 -> 1.00 over 4 f, next word 3 f later
  function wordPop(f, start, i, gap = 3) {
    const d = f - (start + i * gap);
    if (d < 0) return { scale: 0.8, alpha: 0 };
    const scale = d < 2 ? lerp(0.8, 1.05, easeOut(d / 2)) : lerp(1.05, 1, easeOut((d - 2) / 2));
    return { scale, alpha: clamp(d / 2) };
  }

  // 11 whip: out over 4 f ease-in or in over 4 f ease-out, with a horizontal blur amount
  const whipOut = (f, start, width) => { const t = prog(f, start, 4); return { dx: -width * easeIn(t), blur: t > 0 && t < 1 ? 12 : 0 }; };
  const whipIn = (f, start, width) => { const t = prog(f, start, 4); return { dx: width * (1 - easeOut(t)), blur: t > 0 && t < 1 ? 12 : 0 }; };

  return { clamp, lerp, easeOut, easeIn, easeInOut, prog, rng, popIn, slide, dropBounce, punchZoom, hit, squash, blink, idle, wordPop, whipOut, whipIn };
})();
// kit.js - drawing helpers shared by every template. Also records where text lands on each
// frame so the self-check can tell if words sit under the Shorts buttons or are too small.
const K = (() => {
  const boxes = [];
  const FONT = "'Inter Display','Inter','Segoe UI Black','Arial Black',sans-serif";

  // Shorts app covers the top strip, the bottom caption/title area and the right-hand buttons.
  // On a Short the like/comment buttons only sit on the right below the middle.
  function safeZone(w, h) {
    if (h > w) return { x0: 50, y0: Math.round(h * 0.09), x1: w - 50, y1: Math.round(h * 0.78), btnX: w - 160, btnY: Math.round(h * 0.52) };
    return { x0: Math.round(w * 0.05), y0: Math.round(h * 0.05), x1: Math.round(w * 0.95), y1: Math.round(h * 0.95) };
  }

  function font(size, weight = 900, family = FONT) { return `${weight} ${Math.round(size)}px ${family}`; }

  // Fit text to a width by shrinking the size, never below min.
  function fit(ctx, str, maxW, size, weight = 900, min = 40, family = FONT, track = 0) {
    let s = size;
    for (; s > min; s -= 2) {
      ctx.font = font(s, weight, family);
      if (ctx.measureText(str).width + track * s * str.length <= maxW) break;
    }
    return s;
  }

  // Draw text and record its box (in canvas pixels, after the current transform).
  function text(ctx, str, x, y, o = {}) {
    const size = o.size || 80, weight = o.weight || 900;
    ctx.save();
    ctx.font = font(size, weight, o.family);
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.track) ctx.letterSpacing = `${o.track * size}px`;
    const w = ctx.measureText(str).width;
    if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur ?? size * 0.08; ctx.shadowOffsetY = o.shadowY ?? size * 0.06; }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeWidth || size * 0.14; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); ctx.shadowColor = 'transparent'; }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
    if (!o.noRecord && (o.alpha ?? 1) > 0.5) {
      const left = ctx.textAlign === 'center' ? x - w / 2 : ctx.textAlign === 'right' ? x - w : x;
      const m = ctx.getTransform();
      const pts = [[left, y - size / 2], [left + w, y - size / 2], [left, y + size / 2], [left + w, y + size / 2]]
        .map(([px, py]) => [m.a * px + m.c * py + m.e, m.b * px + m.d * py + m.f]);
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      boxes.push({ str, x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys), px: size * Math.hypot(m.c, m.d) });
    }
    ctx.restore();
    return w;
  }

  // Cached noise texture (grain, rust, yarn fuzz). Same seed, same picture.
  const cache = {};
  function grain(w, h, seed, base, spots, amount = 0.5) {
    const key = [w, h, seed, base, spots.join(), amount].join('|');
    if (cache[key]) return cache[key];
    const c = new OffscreenCanvas(w, h), g = c.getContext('2d'), r = M.rng(seed);
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    // big soft stains (blurred so they never look like polka dots)
    g.filter = 'blur(24px)';
    for (let i = 0; i < (w * h) / 40000 * amount + 3; i++) {
      g.globalAlpha = 0.10 + r() * 0.16; g.fillStyle = spots[Math.floor(r() * spots.length)];
      const rr = 40 + r() * 180; g.beginPath(); g.ellipse(r() * w, r() * h, rr, rr * (0.3 + r() * 0.6), r() * 3, 0, 7); g.fill();
    }
    g.filter = 'none';
    // fine pitting
    for (let i = 0; i < (w * h) / 300 * amount; i++) {
      g.globalAlpha = 0.08 + r() * 0.2; g.fillStyle = spots[Math.floor(r() * spots.length)];
      const rr = 0.8 + r() * r() * 5; g.beginPath(); g.arc(r() * w, r() * h, rr, 0, 7); g.fill();
    }
    g.filter = 'none'; g.globalAlpha = 1;
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    return (cache[key] = c);
  }

  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  function rivet(ctx, x, y, r, s) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, s.highlight); g.addColorStop(0.6, s.metal); g.addColorStop(1, s.dark);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }

  // Sparks burst from (x, y) starting at frame start. Deterministic.
  function sparks(ctx, f, start, x, y, seed, color, n = 26, spread = Math.PI * 2, dir = -Math.PI / 2) {
    const d = f - start; if (d < 0 || d > 22) return;
    const r = M.rng(seed);
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = dir + (r() - 0.5) * spread, sp = 18 + r() * 34, life = 10 + r() * 12;
      if (d > life) continue;
      const t = d / life, px = x + Math.cos(a) * sp * d, py = y + Math.sin(a) * sp * d + 1.2 * d * d;
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = color; ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - Math.cos(a) * sp * 0.8, py - Math.sin(a) * sp * 0.8 - 2.4 * d); ctx.stroke();
    }
    ctx.restore();
  }

  // Stand-in for real gameplay under overlays in previews only (never a real clip, no players).
  function footagePlaceholder(ctx, w, h, f) {
    const g = ctx.createLinearGradient(0, 0, w * 0.3, h);
    g.addColorStop(0, '#5d6b73'); g.addColorStop(0.55, '#7a8466'); g.addColorStop(1, '#3d3a2f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
    for (let i = 0; i < 6; i++) { const x = ((i * 397 + f * 3) % (w + 400)) - 200; ctx.fillRect(x, h * 0.55, 140 + i * 30, h * 0.45); }
    ctx.restore();
  }

  return { boxes, FONT, safeZone, font, fit, text, grain, roundRect, rivet, sparks, footagePlaceholder };
})();
// crew21.js - the v21 crew (as on the website "Meet the crew"), drawn in code so it stays sharp at 1080p.
// Feet at (o.x, o.y), o.s scale (1 = ~340 px tall). Round mitts only, never hands.
// Each bot has its own topper: Wrench tool belt, Rowan glasses + bow tie, Skippy headset, Bernard camera,
// Lyra star + cable, Kestrel goggles + feathers, Radar dish.
const C21 = (() => {
  const OUT = '#0f1318';
  const BOTS = {
    wrench:  { name: 'WRENCH',  body: '#f39732', dark: '#b8661a', leg: '#6f441e', eye: '#4fd1d4', ball: '#4fd1d4' },
    rowan:   { name: 'ROWAN',   body: '#60d5d8', dark: '#2f9598', leg: '#316567', eye: '#eef3f7', ball: '#f28c1c' },
    skippy:  { name: 'SKIPPY',  body: '#f3ce5c', dark: '#c19a2a', leg: '#7b621f', eye: '#60d5d8', ball: '#e0352b' },
    bernard: { name: 'BERNARD', body: '#a588ec', dark: '#7258c0', leg: '#4c3d7a', eye: '#f4f4f4', ball: '#e0352b' },
    lyra:    { name: 'LYRA',    body: '#88d779', dark: '#56a548', leg: '#3f7037', eye: '#f4f4f4', ball: '#f2cf4a' },
    kestrel: { name: 'KESTREL', body: '#6b88bc', dark: '#435f93', leg: '#354461', eye: '#f2c94c', ball: '#f2cf4a' },
    radar:   { name: 'RADAR',   body: '#d4dae1', dark: '#9aa3ad', leg: '#585e66', eye: '#7fd16b', ball: '#cbd1d7' },
  };
  const ORDER = ['wrench', 'rowan', 'skippy', 'bernard', 'lyra', 'kestrel', 'radar'];
  const P = (ctx, fill, lw) => { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); };

  function eyes(ctx, f, o, c, s) {
    const face = o.face || 'normal', b = face === 'normal' ? M.blink(f, o.seed || 1) : 1;
    ctx.save(); ctx.fillStyle = c.eye; ctx.strokeStyle = c.eye; ctx.lineCap = 'round';
    ctx.shadowColor = c.eye; ctx.shadowBlur = 18 * s;
    for (const side of [-1, 1]) {
      const x = side * 34 * s, y = -186 * s;
      ctx.lineWidth = 9 * s;
      if (face === 'happy') { ctx.beginPath(); ctx.arc(x, y + 10 * s, 16 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      else if (face === 'tired') { ctx.beginPath(); ctx.moveTo(x - 15 * s, y + 2 * s); ctx.lineTo(x + 15 * s, y + 2 * s); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y + 2 * s, 12 * s, 0, Math.PI); ctx.fill(); }
      else if (face === 'wide') { ctx.beginPath(); ctx.arc(x, y, 21 * s, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(x + 5 * s, y - 4 * s, 7 * s, 0, 7); ctx.fill(); ctx.fillStyle = c.eye; }
      else if (face === 'squint') { ctx.beginPath(); ctx.moveTo(x - 15 * s, y); ctx.lineTo(x + 15 * s, y); ctx.stroke(); }
      else { K.roundRect(ctx, x - 12 * s, y - 22 * s * b, 24 * s, 44 * s * b, 12 * s); ctx.fill(); }

const ordinal = n => n + (['th', 'st', 'nd', 'rd'][n] || 'th');

// ---------- input ----------
function setHold(on) {

  const me = G.me; if (!me || me.finish != null) return;

}
const app = $('app');
app.addEventListener('pointerdown', e => { if (e.target.closest('button,.panel')) return; e.preventDefault(); try { app.setPointerCapture(e.pointerId); } catch (x) {} setHold(true); });
['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => setHold(false)));

addEventListener('keydown', e => {

// ---------- update ----------
function update(dt) {
  G.t += dt;
  if (G.flash && (G.flash.t += dt) > G.flash.dur) G.flash = null;
  if (G.mode === 'count' || G.mode === 'race') {
    const me = G.me;
    if (me.finish == null && me.fall <= 0) me.winding = G.holding;
    if (G.mode === 'count') {
      G.cd -= dt;
      const n = Math.ceil(G.cd);
      if (n < G.lastBeep && n > 0) { G.lastBeep = n; sfx.beep(false); flash(String(n), 0.8); }
      for (const r of G.racers) stepRacer(r, dt, false);
      if (G.cd <= 0) { G.mode = 'race'; sfx.beep(true); flash('GO!', 0.8, '#7fd16b');
        for (const r of G.racers) { if (r.cpu) { r.wantWind = false; r.winding = false; }
          if (!r.winding && r.T >= GOLD) { r.turbo = TURBO_TIME; if (!r.cpu) { sfx.turbo(); flash('PERFECT START!', 1, '#f2cf4a'); } } r.prevWind = r.winding; } }
    } else {
      G.clock += dt;
      for (const r of G.racers) stepRacer(r, dt, true);
      for (const r of G.racers) if (r.photo > 0) r.photo -= dt;
      const allIn = G.done >= G.racers.length;
      if (me.finish != null && (allIn || G.clock - G.endT > 3.5)) endRace();
      if (G.clock > 90) endRace();
    }
    const target = G.me.x - VW * 0.32;
    G.camX += (target - G.camX) * Math.min(1, dt * 6);
  }
}

function endRace() {
  if (G.mode === 'over') return;
  G.mode = 'over'; G.holding = false; $('hud').hidden = true;
  const order = [...G.racers].sort((a, b) => (a.finish ?? 1e9) - (b.finish ?? 1e9) || b.x - a.x);
  const me = G.me, place = order.indexOf(me) + 1;
  $('place').textContent = ordinal(place);
  $('quip').textContent = '“' + QUIPS[me.who][place === 1 ? 0 : 1] + '”';
  let nb = false;
  if (me.finish != null && (!best[me.who] || me.finish < best[me.who])) { best[me.who] = +me.finish.toFixed(2); store.set('best', best); nb = true; }
  $('stamp').hidden = !nb;
  const b = $('board'); b.innerHTML = '';
  order.forEach((r, i) => {
    const li = document.createElement('li'); if (r === me) li.className = 'me';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = C21.BOTS[r.who].body;
    const nm = document.createElement('span'); nm.textContent = (i + 1) + '. ' + C21.BOTS[r.who].name + (r === me ? ' (you)' : '');
    const tm = document.createElement('span'); tm.className = 't'; tm.textContent = r.finish != null ? r.finish.toFixed(2) + ' s' : Math.round(r.x / FINISH * 100) + '%';
    li.append(dot, nm, tm); b.append(li);

  $('msg').textContent = tip + (best[me.who] ? 'Best for ' + C21.BOTS[me.who].name + ': ' + best[me.who].toFixed(2) + ' s' : '');
  setTimeout(() => { $('over').hidden = false; $('again').focus({ preventScroll: true }); }, 700);

function drawRacer(r, camX, isMe) {

  const hop = moving ? Math.abs(Math.sin(r.phase)) * 4 : 0;

  ctx.restore();
  // sproing coil
  if (r.fall > 0) { const p = 1 - r.fall / FALL_TIME, h = 40 * Math.min(1, p * 4);
    ctx.strokeStyle = '#d6dce2'; ctx.lineWidth = 3; ctx.beginPath(); for (let k = 0; k <= 40; k++) { const t = k / 40; ctx.lineTo(x - 30 + Math.sin(t * 30) * 7, y - 18 - t * h - Math.sin(p * 30) * 3 * (1 - p)); } ctx.stroke(); }
  // photo flash
  if (r.photo > 0.9) { ctx.fillStyle = 'rgba(255,255,255,' + ((r.photo - 0.9) * 4) + ')'; ctx.beginPath(); ctx.arc(x + 20, y - 60, 40, 0, 7); ctx.fill(); }
  // peppermint sparkle
  if (r.mintFx > 0) { ctx.fillStyle = '#fff'; for (let k = 0; k < 5; k++) { const a = k * 1.26 + G.t * 6, d = 24 + (0.6 - r.mintFx) * 50; ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y - 34 + Math.sin(a) * d, 2.5, 0, 7); ctx.fill(); } }
  // "YOU" marker + little tension ring
  if (isMe && G.mode !== 'over') { // gold ring under the feet + a YOU tag beside the toy, inside its own lane
    ctx.strokeStyle = '#f2cf4a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y + 2, 30, 7, 0, 0, 7); ctx.stroke();
    ctx.font = "400 12px 'Bungee','Impact',sans-serif"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.lineJoin = 'round';
    ctx.strokeText('◀ YOU', x + 50, y - 26); ctx.fillStyle = '#f2cf4a'; ctx.fillText('◀ YOU', x + 50, y - 26);
  }
  if (r.bubble) {
    ctx.font = "900 12px 'Nunito',sans-serif"; const w = ctx.measureText(r.bubble.text).width + 16, bx = x - w / 2 + 10, byy = y - 112;
    rr(bx, byy, w, 22, 8); fillStroke('#fff', 2.5);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 2, byy + 21); ctx.lineTo(x + 6, byy + 30); ctx.lineTo(x + 10, byy + 21); ctx.fill();
    ctx.fillStyle = '#0f1318'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(r.bubble.text, bx + w / 2, byy + 11.5);
  }
}

function drawHUD() {
  const me = G.me; if (!me) return;
  // progress strip
  const px = 16, pw = Math.min(VW - 140, 520), py = Math.max(18, laneTop - 250);
  rr(px - 8, py - 8, pw + 16, 64, 12); ctx.fillStyle = 'rgba(6,10,28,0.72)'; ctx.fill();
  rr(px, py, pw, 14, 7); fillStroke('#0f1733', 3);
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(px + pw - 6, py + 2, 4, 10);
  for (const r of G.racers) { const fx = px + 8 + clamp(r.x / FINISH, 0, 1) * (pw - 16);
    ctx.beginPath(); ctx.arc(fx, py + 7, r === me ? 9 : 7, 0, 7); fillStroke(C21.BOTS[r.who].body, r === me ? 3.5 : 2.5); }
  // time + place
  const place = [...G.racers].sort((a, b) => (a.finish ?? 1e9) - (b.finish ?? 1e9) || b.x - a.x).indexOf(me) + 1;
  ctx.font = "400 22px 'Bungee','Impact',sans-serif"; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.lineWidth = 5; ctx.strokeStyle = OUT;
  const tt = (me.finish ?? G.clock).toFixed(1) + ' s', pl = ordinal(place);
  ctx.strokeText(pl, px, py + 24); ctx.fillStyle = '#f2cf4a'; ctx.fillText(pl, px, py + 24);
  ctx.strokeText(tt, px + 80, py + 24); ctx.fillStyle = '#fff'; ctx.fillText(tt, px + 80, py + 24);
  // tension gauge
  const gx = 24, gw = Math.min(VW - 48, 560), gy = laneTop + LANES * LANE_H + 52, gh = 30;
  const bx = (VW - gw) / 2 + 0 * gx;
  rr(bx, gy, gw, gh, 15); fillStroke('#0f1733', 3.5);
  ctx.save(); rr(bx, gy, gw, gh, 15); ctx.clip();
  ctx.fillStyle = 'rgba(242,207,74,0.28)'; ctx.fillRect(bx + gw * GOLD, gy, gw * (SPROING_T - GOLD), gh);
  const fill = clamp(me.T / SPROING_T, 0, 1);
  const gc = me.T >= GOLD ? '#f2cf4a' : '#f39732';
  ctx.fillStyle = gc; ctx.fillRect(bx, gy, gw * fill, gh);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(bx, gy + 4, gw * fill, 6);
  ctx.restore();
  ctx.strokeStyle = '#f2cf4a'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(bx + gw * GOLD, gy - 6); ctx.lineTo(bx + gw * GOLD, gy + gh + 6); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = "400 13px 'Bungee','Impact',sans-serif"; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#f2cf4a'; ctx.fillText('TURBO', bx + gw - 8, gy - 4);
  ctx.textAlign = 'left'; ctx.fillStyle = '#b3bfd6'; ctx.fillText('WIND', bx + 4, gy - 4);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = "900 14px 'Nunito',sans-serif"; ctx.fillStyle = '#b3bfd6';
  const hint = me.fall > 0 ? 'Sproing! Back up in a sec...' : me.winding ? (me.T >= GOLD ? 'LET GO NOW for turbo!' : 'Winding... let go in the gold') : me.T <= 0 && G.mode === 'race' ? 'Wound down! Hold to wind' : 'Hold anywhere to wind';
  ctx.fillText(hint, VW / 2, gy + gh + 12);
  // big flash text
  if (G.flash) {
    const f = G.flash, p = f.t / f.dur, s = p < 0.15 ? 0.6 + p / 0.15 * 0.5 : 1.1 - Math.min(0.1, (p - 0.15));
    ctx.save(); ctx.globalAlpha = p > 0.75 ? 1 - (p - 0.75) / 0.25 : 1; ctx.translate(VW / 2, laneTop - 60); ctx.scale(s, s);
    ctx.font = "400 46px 'Bungee','Impact',sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 10; ctx.strokeStyle = OUT; ctx.lineJoin = 'round';
    ctx.strokeText(f.text, 0, 0); ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0); ctx.restore();
  }
}

function draw() {
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = '#0a1230'; ctx.fillRect(0, 0, VW, VH);
  const camX = G.mode === 'title' ? (G.t * 60) % FINISH - 100 : G.camX;
  drawBackground(camX); drawTable(camX);
  if (G.mode === 'title') { // toys idle-run on the title screen behind the menu
    if (!G.demo) G.demo = C21.ORDER.slice(0, 4).map((k, i) => ({ ...makeRacer(k, i, true), T: 0.6 }));
    G.demo.forEach((r, i) => { r.x = camX + 120 + i * 90 + Math.sin(G.t + i) * 40; r.phase = G.t * 12 + i; drawRacer(r, camX, false); });
    return;
  }
  for (let l = 0; l < LANES; l++) for (const it of G.track) drawItem(it, camX, l);
  drawFinishArch(camX);
  for (const r of G.racers) drawRacer(r, camX, r === G.me);
  drawHUD();
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
  draw();
  requestAnimationFrame(frame);
}

// ---------- menus ----------
function refreshPicker() {
  const p = $('pick'); p.innerHTML = '';
  for (const k of C21.ORDER) {
    if (!AI[k]) continue;
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(k === G.pick)); b.setAttribute('aria-label', 'Race as ' + C21.BOTS[k].name);
    const c = document.createElement('canvas'); c.width = 160; c.height = 150; const g = c.getContext('2d');
    g.save(); g.translate(92, 136); drawKeyOn(g, 0.36); C21.bot(g, 10, { who: k, x: 0, y: 0, s: 0.36, seed: 3, noShadow: true, arms: 0.2 }); g.restore();
    const nm = document.createElement('span'); nm.textContent = C21.BOTS[k].name;
    const sm = document.createElement('small'); sm.textContent = best[k] ? 'Best ' + best[k].toFixed(2) + ' s' : 'No time yet';
    b.append(c, nm, sm);
    b.onclick = () => { G.pick = k; store.set('pick', k); refreshPicker(); };
    p.append(b);
  }
}
function drawKeyOn(g, s) { const save = ctx; /* draw the key on a small canvas */
  g.strokeStyle = OUT; g.lineWidth = 14 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(-90 * s, -160 * s); g.lineTo(-150 * s, -160 * s); g.stroke();
  g.strokeStyle = '#c9a24a'; g.lineWidth = 6 * s; g.stroke();
  for (const side of [-1, 1]) { g.beginPath(); g.ellipse(-160 * s, -160 * s + side * 20 * s, 15 * s, 18 * s, 0, 0, 7); g.fillStyle = '#f2cf4a'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = OUT; g.stroke(); }
  void save; }

$('dNum').textContent = '#' + DAY;
$('go').onclick = startRace;
$('again').onclick = startRace;
$('change').onclick = toTitle;
$('bQuit').onclick = toTitle;
const sb = $('bSound'); sb.setAttribute('aria-pressed', String(soundOn));
sb.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); sb.setAttribute('aria-pressed', String(soundOn)); };
$('share').onclick = async () => {
  const r = G.result; if (!r) return;
  const medal = ['🥇', '🥈', '🥉', '🎄'][r.place - 1] || '🎄';
  const txt = `Crew Wind-Up Derby · Track #${DAY}\n${medal} ${ordinal(r.place)} as ${C21.BOTS[r.who].name}` + (r.time != null ? ` · ${r.time.toFixed(2)} s` : '');
  try { await navigator.clipboard.writeText(txt); $('msg').textContent = 'Copied! Paste it anywhere.'; } catch (e) { $('msg').textContent = txt; }
};
refreshPicker();
if (location.search.includes('simtest')) window.__derby = { G, AI, makeRacer, newTarget, stepRacer, buildTrack, set: (k, v) => { G[k] = v; } };
requestAnimationFrame(frame);
})();
</script>
