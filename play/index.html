<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Arcade Jigsaw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one arcade cabinet; marquee strip on top, the puzzle table fills the screen, a control rail under it. Single committed dark look. */
:root{
  --night:#141a24; --table:#1d2635; --felt:#24304a; --line:#34425f;
  --ink:#eef3f7; --dim:#9fb0c8;
  --orange:#f39732; --teal:#60d5d8; --yellow:#f3ce5c;
  --display:'Bungee','Impact',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.marquee{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.02em;line-height:1.05}
h1 .a{color:var(--orange)} h1 .b{color:var(--teal)}
.tag{font-size:13px;color:var(--dim);margin:2px 0 0}
.stats{display:flex;gap:8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat{background:var(--table);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:64px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--yellow);font-weight:500}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-family:var(--body);font-weight:800}
.tablebox{position:relative;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--table) 70%);border:2px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:auto;cursor:grab}
canvas.drag{cursor:grabbing}
.rail{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:2px}
button{font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--teal)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
button[aria-pressed="true"]{background:var(--teal);color:var(--night);border-color:var(--teal)}
button.go{background:var(--orange);color:var(--night);border-color:var(--orange)}
.win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,36,.55);pointer-events:none;opacity:0;transition:opacity .4s}
.win.show{opacity:1;pointer-events:auto}
.card{background:var(--night);border:2px solid var(--orange);border-radius:14px;padding:18px 22px;text-align:center;max-width:min(360px,86%);display:grid;gap:8px}
.card h2{font-family:var(--display);font-weight:400;margin:0;color:var(--yellow);font-size:26px}
.card p{margin:0;color:var(--dim)}
.note{font-size:12px;color:var(--dim);margin:0}
@media (prefers-reduced-motion:reduce){.win{transition:none}}
</style>

<div class="wrap">
  <div class="marquee">
    <div>
      <h1><span class="a">CREW</span> <span class="b">ARCADE</span></h1>
      <p class="tag" id="sub">Daily jigsaw. A new crew scene every day.</p>
    </div>
    <a href="/derby" aria-label="Play Wind-Up Derby" style="display:block;max-width:180px;padding:10px 14px;background:#24304a;border:2px solid #f3ce5c;border-radius:12px;color:#eef3f7;text-decoration:none;font-weight:800">🎄 Play Wind-Up Derby<br><small style="color:#9fb0c8">Hold to wind. Let go to race.</small></a>
    <div class="stats">
      <div class="stat"><b id="t">0:00</b><span>Time</span></div>
      <div class="stat"><b id="left">0</b><span>Left</span></div>
      <div class="stat"><b id="best">--</b><span>Best</span></div>
    </div>
  </div>

  <div class="tablebox" id="box">
    <canvas id="cv" width="1600" height="1000" aria-label="Jigsaw puzzle table. Drag pieces into the frame."></canvas>
    <div class="win" id="win"><div class="card">
      <h2>SOLVED!</h2>
      <p id="winmsg">Nice work.</p>
      <button class="go" id="again">Play again</button>
    </div></div>
  </div>

  <div class="rail">
    <div class="group" role="group" aria-label="Scene">
      <button id="s-today" data-scene="today">Today's puzzle</button>
      <span class="lbl" style="margin-left:8px">Past puzzles</span>
      <button data-scene="workshop">Workshop</button>
      <button data-scene="snowday">Snow Day</button>
      <button data-scene="gingerbread">Gingerbread</button>
    </div>
    <div class="group" role="group" aria-label="Pieces">
      <span class="lbl">Pieces</span>
      <button data-n="12">12</button>
      <button data-n="35">35</button>
      <button data-n="70">70</button>
    </div>
    <div class="group">
      <button id="peek">Peek</button>
      <button id="shuffle">Shuffle</button>
    </div>
  </div>
  <p class="note">Prototype for the website. Art: the crew Christmas puzzle scenes (same art as the printed puzzle).</p>
</div>

const NAMES = {workshop:'The Workshop', snowday:'Snow Day', gingerbread:'Gingerbread Town'};
const ORDER = ['workshop','snowday','gingerbread'];
const GRIDS = {12:[4,3], 35:[7,5], 70:[10,7]};
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 1600, H = 1000;
const FR = {w: 900, h: 664};
function layout(){
  const narrow = document.getElementById('box').clientWidth < 700;
  if (narrow){ W = 1000; H = 1560; FR.x = 50; FR.y = 40; } else { W = 1600; H = 1000; FR.x = (W - FR.w)/2; FR.y = (H - FR.h)/2; }
  cv.width = W; cv.height = H;
}

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function dayIndex(){ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }

let state = {scene:'today', n:12};
try { const n = +store.get('arcade-n'); if (GRIDS[n]) state.n = n; } catch(e){}
if (innerWidth < 600 && !store.get('arcade-n')) state.n = 12;

let img = new Image(), pieces = [], cols, rows, pw, ph, tab, startT = 0, elapsed = 0, timer = null, done = false, peek = false, drag = null, sceneKey;

function sceneFor(){ return state.scene === 'today' ? ORDER[dayIndex() % 3] : state.scene; }

function build(seedExtra){
  layout();
  sceneKey = sceneFor();
  [cols, rows] = GRIDS[state.n];
  pw = FR.w/cols; ph = FR.h/rows; tab = Math.min(pw,ph)*0.22;
  const r = rng(dayIndex()*97 + state.n*7 + ORDER.indexOf(sceneKey)*13 + (seedExtra||0));
  // edge shapes: +1 tab out, -1 tab in
  const hz = [], vt = [];
  for (let y=0;y<rows-1;y++){ hz[y]=[]; for (let x=0;x<cols;x++) hz[y][x] = r()<.5?1:-1; }
  for (let y=0;y<rows;y++){ vt[y]=[]; for (let x=0;x<cols-1;x++) vt[y][x] = r()<.5?1:-1; }
  pieces = [];
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){
    const p = {gx:x, gy:y,
      top: y===0?0:-hz[y-1][x], bottom: y===rows-1?0:hz[y][x],
      left: x===0?0:-vt[y][x-1], right: x===cols-1?0:vt[y][x],
      tx: FR.x + x*pw, ty: FR.y + y*ph, locked:false};
    // scatter around the frame (margins) and a little over it
    let px, py, tries = 0;
    do {
      px = 10 + r()*(W - pw - 20); py = 10 + r()*(H - ph - 20); tries++;
    } while (tries < 40 && px > FR.x - pw*0.6 && px < FR.x + FR.w - pw*0.4 && py > FR.y - ph*0.6 && py < FR.y + FR.h - ph*0.4);
    p.x = px; p.y = py;
    p.path = piecePath(p);
    pieces.push(p);
  }
  for (let i=pieces.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [pieces[i],pieces[j]]=[pieces[j],pieces[i]]; }
  done = false; elapsed = 0; startT = 0; clearInterval(timer); timer = null;
  document.getElementById('win').classList.remove('show');
  document.getElementById('sub').textContent = (state.scene==='today' ? "Today's scene: " : 'Scene: ') + NAMES[sceneKey];
  const b = store.get(`arcade-best-${sceneKey}-${state.n}`);
  document.getElementById('best').textContent = b ? fmt(+b) : '--';
  updHUD(); syncButtons();
  if (img.dataset.k !== sceneKey){ img = new Image(); img.dataset.k = sceneKey; img.onload = draw; img.src = 'data:image/jpeg;base64,' + IMGS[sceneKey]; }
  draw();
}

// one edge from (0,0) to (len,0) with a tab of direction d (tab bulges toward -y when d=1 in local frame)
function edge(path, x0,y0, x1,y1, d){
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=uy, ny=-ux;
  const P=(a,b)=>[x0+ux*a*len+nx*b*tab*d*1, y0+uy*a*len+ny*b*tab*d*1];
  if (!d){ path.lineTo(x1,y1); return; }
  const pts = [[.36,0],[.40,0.05],[.38,.55],[.34,1.0],[.42,1.25],[.5,1.25],[.58,1.25],[.66,1.0],[.62,.55],[.60,0.05],[.64,0]];
  let p=P(...pts[0]); path.lineTo(p[0],p[1]);
  for (let i=1;i+2<pts.length;i+=3){ const a=P(...pts[i]), b=P(...pts[i+1]), c=P(...pts[i+2]); path.bezierCurveTo(a[0],a[1],b[0],b[1],c[0],c[1]); }
  path.lineTo(x1,y1);
}
function piecePath(p){
  const path = new Path2D(); path.moveTo(0,0);
  edge(path, 0,0, pw,0, p.top);
  edge(path, pw,0, pw,ph, p.right);
  edge(path, pw,ph, 0,ph, p.bottom);
  edge(path, 0,ph, 0,0, p.left);
  path.closePath(); return path;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // frame
  ctx.save();
  ctx.fillStyle = 'rgba(10,14,22,.55)'; ctx.fillRect(FR.x, FR.y, FR.w, FR.h);
  if ((peek || done) && img.complete && img.naturalWidth){ ctx.globalAlpha = done ? 1 : .28; ctx.drawImage(img, FR.x, FR.y, FR.w, FR.h); ctx.globalAlpha = 1; }
  ctx.strokeStyle = '#34425f'; ctx.lineWidth = 3; ctx.setLineDash([10,8]); ctx.strokeRect(FR.x-2, FR.y-2, FR.w+4, FR.h+4);
  ctx.restore();
  if (done) return;
  const sx = 1200/FR.w;
  // locked first, then loose
  for (const pass of [true,false]) for (const p of pieces){
    if (p.locked !== pass) continue;
    ctx.save(); ctx.translate(p.x, p.y);
    if (!p.locked){ ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur = p===drag?.p ? 18 : 8; ctx.shadowOffsetY = p===drag?.p ? 8 : 3; ctx.fillStyle='#000'; ctx.fill(p.path); ctx.shadowColor='transparent'; }
    ctx.save(); ctx.clip(p.path);
    if (img.complete && img.naturalWidth){
      const ox = (p.gx*pw - tab*1.5), oy = (p.gy*ph - tab*1.5), ww = pw + tab*3, hh = ph + tab*3;
      ctx.drawImage(img, ox*sx, oy*sx, ww*sx, hh*sx, -tab*1.5, -tab*1.5, ww, hh);
    } else { ctx.fillStyle='#2a3550'; ctx.fillRect(-tab,-tab,pw+2*tab,ph+2*tab); }
    ctx.restore();
    ctx.lineWidth = p.locked ? 1 : 2; ctx.strokeStyle = p.locked ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.55)'; ctx.stroke(p.path);
    ctx.restore();
  }
}

function toCanvas(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)*W/r.width, (e.clientY - r.top)*H/r.height]; }
cv.addEventListener('pointerdown', e=>{
  if (done) return;
  const [mx,my] = toCanvas(e);
  for (let i=pieces.length-1;i>=0;i--){
    const p = pieces[i]; if (p.locked) continue;
    ctx.save(); const hit = ctx.isPointInPath(p.path, mx-p.x, my-p.y); ctx.restore();
    if (hit){
      pieces.splice(i,1); pieces.push(p);
      drag = {p, dx: mx-p.x, dy: my-p.y}; cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
      if (!timer){ startT = performance.now() - elapsed*1000; timer = setInterval(tick, 250); }
      draw(); return;
    }
  }
});
cv.addEventListener('pointermove', e=>{ if (!drag) return; const [mx,my]=toCanvas(e); drag.p.x = mx-drag.dx; drag.p.y = my-drag.dy; draw(); });
function drop(){
  if (!drag) return; const p = drag.p; drag = null; cv.classList.remove('drag');
  if (Math.hypot(p.x-p.tx, p.y-p.ty) < Math.min(pw,ph)*0.3){ p.x=p.tx; p.y=p.ty; p.locked=true; pieces.splice(pieces.indexOf(p),1); pieces.unshift(p); }
  updHUD(); draw();
  if (pieces.every(q=>q.locked)) finish();
}
cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop);

function tick(){ elapsed = (performance.now()-startT)/1000; document.getElementById('t').textContent = fmt(elapsed); }
function fmt(s){ s = Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updHUD(){ document.getElementById('left').textContent = pieces.filter(p=>!p.locked).length; }
function finish(){
  window.UBStickers?.give('g2');
  tick(); clearInterval(timer); timer=null; done = true; draw();
  const k = `arcade-best-${sceneKey}-${state.n}`, prev = +store.get(k) || 0;
  const isBest = !prev || elapsed < prev; if (isBest) store.set(k, String(Math.floor(elapsed)));
  document.getElementById('best').textContent = fmt(isBest ? elapsed : prev);
  const lines = ['Rowan has marked this APPROVED.','Kestrel checked every piece twice.','Skippy wants to do it again. Louder.','Wrench says nothing is broken. For once.','Radar pinged the whole crew about it.'];
  document.getElementById('winmsg').textContent = `${NAMES[sceneKey]}, ${state.n} pieces in ${fmt(elapsed)}${isBest?' (new best)':''}. ${lines[Math.floor(Math.random()*lines.length)]}`;
  document.getElementById('win').classList.add('show');
}
function syncButtons(){
  document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.scene===state.scene));
  document.querySelectorAll('[data-n]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.n===state.n));
  document.getElementById('peek').setAttribute('aria-pressed', peek);
}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{ state.scene=b.dataset.scene; build(); });
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ state.n=+b.dataset.n; store.set('arcade-n', state.n); build(); });
document.getElementById('peek').onclick=()=>{ peek=!peek; syncButtons(); draw(); };
document.getElementById('shuffle').onclick=()=>build(Math.floor(Math.random()*1e6));
document.getElementById('again').onclick=()=>build(Math.floor(Math.random()*1e6));
build();
</script>
