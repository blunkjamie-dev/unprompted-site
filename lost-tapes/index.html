<style>
/* Layout: one screen. A pop-up book lies on a dark desk under a warm lamp; a VCR-style remote sits under it. Single dark look by choice. */
:root {
  --desk: #140e0a;
  --desk-hi: #4a3321;
  --ink: #f3ead6;
  --muted: #b8a88d;
  --tape-yellow: #ffd23a;
  --tape-red: #c63a2c;
  --osd: #8dffa8;
  --remote: #1d1b1a;
  --remote-key: #2e2b29;
  --display: 'Archivo', 'Arial Black', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --crt: 'VT323', 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(255, 196, 120, .20), transparent 70%),
    repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 3px, transparent 3px 11px),
    linear-gradient(180deg, #23170f, var(--desk) 70%);
  background-color: var(--desk);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 0; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 900; font-stretch: 125%; letter-spacing: .02em; font-size: 18px; color: var(--tape-yellow); text-transform: uppercase; }
.brand small { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; color: var(--muted); margin-left: 10px; }
.hint { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#stage { flex: 1; position: relative; min-height: 0; touch-action: pan-y; }
#scaler { position: absolute; left: 50%; top: 50%; width: 940px; height: 680px; perspective: 2300px; perspective-origin: 50% 30%; }
#book { position: absolute; left: 30px; top: 118px; width: 880px; height: 560px; transform-style: preserve-3d;
  transform: rotateX(34deg) translateX(var(--bx, 0px)); transition: transform 1s cubic-bezier(.5,.1,.25,1); }
.board { position: absolute; top: -10px; height: 580px; width: 452px; background: linear-gradient(135deg, #7a2620, #4d1511); border-radius: 8px;
  box-shadow: 0 30px 50px rgba(0,0,0,.55); transform: translateZ(-3px); transition: opacity .6s; }
.board.l { left: -12px; } .board.r { left: 440px; }
.base { position: absolute; top: 0; width: 440px; height: 560px; overflow: hidden; }
.base.l { left: 0; border-radius: 6px 0 0 6px; transition: opacity .6s; } .base.r { left: 440px; border-radius: 0 6px 6px 0; }
.base canvas, .face canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.leaf { position: absolute; left: 440px; top: 0; width: 440px; height: 560px; transform-origin: 0 50%; transform-style: preserve-3d;
  transition: transform .95s cubic-bezier(.45,.05,.3,1); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; border-radius: 0 6px 6px 0; background: #e9e0c8; }
.face.back { transform: rotateY(180deg); border-radius: 6px 0 0 6px; }
.shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,0) 70%); }
.leaf.turning .shade { animation: shade .95s ease-in-out; }
@keyframes shade { 0% { opacity: 0 } 50% { opacity: 1 } 100% { opacity: 0 } }
.spread { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(6px); pointer-events: none; visibility: hidden; }
.spread.on { visibility: visible; }
.pop { position: absolute; transform-origin: 50% calc(100% - 10px); transform: rotateX(var(--a, 0deg)); opacity: 0;
  transition: transform .75s cubic-bezier(.3,1.55,.55,1), opacity .2s; will-change: transform; }
.pop canvas { width: 100%; height: 100%; display: block; }
.spread.on .pop.up.tap { pointer-events: auto; cursor: pointer; }
.cc span { pointer-events: auto; cursor: pointer; }
.eggbadge { position: absolute; left: 50%; top: 372px; transform: translateX(-50%) rotate(2deg); width: 300px; padding: 10px 12px; background: #ffd23a; color: #3a1d0a; font: 900 16px Archivo, sans-serif; text-align: center; letter-spacing: .04em; box-shadow: 2px 4px 0 rgba(0,0,0,.4); }
.eggbadge small { display: block; font: 700 12px 'IBM Plex Mono', monospace; margin-top: 4px; letter-spacing: 0; }
.tabwrap.off { visibility: hidden; }
#sheet { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(8,6,4,.78); padding: 16px; }
#sheet.on { display: grid; }
.sheetbox { width: min(560px, 100%); max-height: 100%; overflow: auto; background: #f6f0e0; border-radius: 14px; padding: 16px 16px 18px; box-shadow: 0 14px 40px rgba(0,0,0,.6); color: #2a1d10; }
.sheetbox h2 { margin: 0 0 2px; font: 900 22px Archivo, sans-serif; letter-spacing: .03em; }
.sheetbox p { margin: 0 0 12px; font: 700 12px 'IBM Plex Mono', monospace; color: #6b5a44; }
.stk { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.stk div { aspect-ratio: 1; border: 2px dashed #c9b994; border-radius: 50%; display: grid; place-items: center; font: 900 26px Archivo, sans-serif; color: #c9b994; }
.stk div.got { border: 0; }
.stk canvas { width: 100%; height: 100%; }
.sheetbox .close { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 10px; background: #2a2725; color: #fff; font: 700 14px 'IBM Plex Mono', monospace; cursor: pointer; }
#stkbtn { position: relative; }
#stkbtn b { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: #ffd23a; color: #3a1d0a; font: 900 11px Archivo, sans-serif; display: grid; place-items: center; padding: 0 4px; }
#stkbtn.pulse { animation: stkp .6s 2; } @keyframes stkp { 50% { transform: scale(1.18); } }
.pop.up { --a: -60deg; opacity: 1; }
.pop.fold { transition: transform .32s cubic-bezier(.6,0,.9,.5), opacity .25s .1s; }
.psh { position: absolute; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(20,10,0,.55), rgba(20,10,0,0)); opacity: 0; transition: opacity .6s; }
.psh.up { opacity: 1; }
/* captions: 1985 closed captions */
.cc { position: absolute; left: 22px; right: 22px; bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.cc span { background: #000; color: #fff; font-family: var(--crt); font-size: 22px; line-height: 1.02; padding: 3px 9px 1px; text-transform: uppercase; letter-spacing: .02em; text-align: center; }
.cc.swap span { animation: ccIn .35s steps(3); }
@keyframes ccIn { from { opacity: 0 } to { opacity: 1 } }
/* pull tab */
.tabwrap { position: absolute; right: 24px; bottom: 22px; width: 250px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.tablabel { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #3a2a1c; background: rgba(255,248,230,.85); padding: 2px 6px; }
.slot { position: relative; width: 250px; height: 40px; border-radius: 6px; background: linear-gradient(180deg, #1a120c, #3a2a1e); box-shadow: inset 0 3px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.4); }
.tab { position: absolute; left: 4px; top: 4px; height: 32px; width: 108px; border: 0; border-radius: 4px 14px 14px 4px; cursor: grab;
  background: linear-gradient(180deg, #fff7e2, #e6d6b2); color: var(--tape-red); font-family: var(--display); font-weight: 900; font-stretch: 112%; font-size: 15px; letter-spacing: .06em;
  box-shadow: 0 2px 0 #b19d74, 2px 4px 6px rgba(0,0,0,.4); transition: transform .35s cubic-bezier(.3,1.4,.5,1); touch-action: none; pointer-events: auto; }
.tab:active { cursor: grabbing; }
.tab.drag { transition: none; }
.tab:focus-visible { outline: 3px solid var(--tape-yellow); outline-offset: 2px; }
.tab.done { color: #3d7a3a; }
.endbtn { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%) rotate(-3deg); border: 0; cursor: pointer; pointer-events: auto;
  background: var(--tape-yellow); color: #7a1d14; font-family: var(--display); font-weight: 900; font-stretch: 110%; font-size: 19px; padding: 12px 20px; letter-spacing: .03em; box-shadow: 0 4px 0 #b08c12, 0 8px 14px rgba(0,0,0,.4); }
.endbtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
/* flicker + OSD overlays */
#dim { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; }
#osd { position: absolute; left: 6%; top: 6%; font-family: var(--crt); font-size: clamp(22px, 4vw, 40px); color: #fff; text-shadow: 2px 2px 0 #000; opacity: 0; pointer-events: none; letter-spacing: .04em; }
/* remote */
.remote { display: flex; justify-content: center; padding-block: 8px max(12px, env(safe-area-inset-bottom, 0px)); }
.remote-body { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: linear-gradient(180deg, #2a2725, var(--remote)); border-radius: 14px; box-shadow: 0 8px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); max-width: 100%; }
.key { border: 0; min-width: 46px; height: 42px; padding: 0 12px; border-radius: 9px; background: var(--remote-key); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .06em; cursor: pointer;
  box-shadow: 0 3px 0 #0c0b0a, inset 0 1px 0 rgba(255,255,255,.08); }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 #0c0b0a; }
.key:focus-visible { outline: 2px solid var(--tape-yellow); outline-offset: 2px; }
.key.play { background: var(--tape-red); color: #fff; min-width: 96px; }
.key[disabled] { opacity: .35; cursor: default; }
.lcd { font-family: var(--crt); font-size: 24px; color: var(--osd); background: #061209; border-radius: 6px; padding: 4px 12px; min-width: 112px; text-align: center; text-shadow: 0 0 8px rgba(80,255,130,.6); box-shadow: inset 0 2px 6px rgba(0,0,0,.8); font-variant-numeric: tabular-nums; }
#sound[aria-pressed="false"] { color: var(--muted); }
@media (max-width: 520px) { .hint { display: none; } .key { min-width: 40px; padding: 0 9px; } .key.play { min-width: 74px; } .lcd { min-width: 84px; font-size: 21px; } .brand small { display: none; } }
@media (prefers-reduced-motion: reduce) { .leaf { transition-duration: .3s; } .pop { transition-duration: .3s; } #book { transition-duration: .3s; } }
body.small .cc { bottom: 26px; left: 14px; right: 14px; } body.small .cc span { font-size: 40px; padding: 4px 12px 2px; }
body.small .tabwrap { width: 320px; right: 16px; bottom: 18px; } body.small .tablabel { font-size: 21px; } body.small .slot { width: 320px; height: 66px; } body.small .tab { height: 58px; width: 150px; font-size: 26px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--crt); font-size: 28px; color: var(--osd); }

/* Keep every remote control and the sticker sheet inside a phone viewport. */
@media (max-width: 520px) {
  .remote-body { display: grid; grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 6px; width: 100%; box-sizing: border-box; }
  .remote-body .lcd { grid-column: 1 / -1; grid-row: 1; min-width: 0; box-sizing: border-box; }
  .remote-body .key { min-width: 0; width: 100%; height: 44px; padding: 0 4px; font-size: 12px; }
  #sheet, .sheetbox { box-sizing: border-box; }
}

$('#sound').addEventListener('click', e => { A.on = !A.on; e.currentTarget.setAttribute('aria-pressed', A.on); e.currentTarget.textContent = A.on ? 'SND' : 'MUTE'; if (A.on) { ac(); SFX.beep(); } });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); });
let px0 = null, py0 = null;
stage.addEventListener('pointerdown', e => { px0 = e.clientX; py0 = e.clientY; });
stage.addEventListener('pointerup', e => {
  if (px0 == null) return; const dx = e.clientX - px0, dy = e.clientY - py0; px0 = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) { const r = stage.getBoundingClientRect(); if (cur === 0) go(1); else go(e.clientX > r.left + r.width / 2 ? 1 : -1); }
});
window.addEventListener('resize', fit);

async function start() {
  const fonts = ['900 20px Archivo', '800 20px Archivo', '700 12px "IBM Plex Mono"', '20px VT323'];
  try { await Promise.race([Promise.all(fonts.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  fit(); const sc = scale;
  R = Math.min(2, Math.max(1, DPR * sc * 1.1)); RP = Math.min(1.6, Math.max(.9, DPR * sc));
  build(); scanKinds(); eggShow(); $('#loading').remove(); requestAnimationFrame(loop);
  const h = (location.hash || '').match(/^#page-(\d)$/); if (h) { const n = Math.min(+h[1], N); for (let k = 0; k < n; k++) leaves[k].turned = true; cur = n; layoutLeaves(true); if (cur >= 1 && cur <= NS) openSpread(cur); }
}
start();
})();
